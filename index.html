        else if (PT.rng(s.seed, s.day, 'strike')() < 0.5) { s.todayDown.push({ id: 'all', from: 0, to: 240, label: '작업 거부' }); c.result = '오전 내내 작업을 멈췄습니다.'; }
        else c.result = '다행히 그냥 넘어갔습니다.';
        break;
      case 'resign': case 'poach': {
        const m = s.managers.find(x => x.id === c.mid);
        if (!m) break;
        if (choice === 'keep') { m.salary = Math.round(m.salary * (c.kind === 'resign' ? 1.25 : 1.2) / 10000) * 10000; m.sat = clamp(m.sat + 25, 0, 100); c.result = `${m.name}님이 남기로 했습니다.`; }
        else { quit(s, m, c.kind === 'resign' ? '지쳐서' : '경쟁사로'); c.result = `${m.name}님이 떠났습니다.`; }
        break;
      }
    }
  };
  function genSkuOrders(s, recipe) {
    const keep = s.enabled;
    s.enabled = keep.filter(id => PT.SKU[id].recipe === recipe);
    const contract = s.contract; s.contract = null;
    genOrders(s);
    s.enabled = keep; s.contract = contract;
  }
  G.pendingChoice = s => s.morning.some(c => c.choices && !c.done);

  G.preview = function (s, record) {
    const P = PT.compile(s);
    const issues = PT.validate(s, P);
    if (issues.length) return { ok: false, issues, P };
    const res = PT.simulate(P, s.plan, { dayMin: G.dayMin(s), start: s.lastSku, record, down: s.todayDown });
    return { ok: true, issues: [], P, res };
  };

  // ── 하루 가동 ────────────────────────────────────
  G.runDay = function (s) {
    const P = PT.compile(s);
    if (PT.validate(s, P).length) return null;
    const mods = PT.mods(s), dayMin = G.dayMin(s);
    const rng = PT.rng(s.seed, s.day, 'run');
    const uAcc = rng(), tAcc = rng(), uBrk = rng(), mBrk = rng(), tBrk = rng(), dBrk = rng(), uAud = rng();
    const down = s.todayDown.slice(), events = [];
    let eventCost = 0;
    if (uAcc < 0.03 * mods.accident) {
      const t0 = Math.round(60 + tAcc * (dayMin - 180));
      down.push({ id: 'all', from: t0, to: t0 + 120, label: '안전사고' });
      eventCost += 4000000; s.totals.accidents++;
      events.push({ t: t0, tone: 'bad', text: `안전사고 발생. 2시간 멈추고 처리 비용 ${won(4000000)}. 생산 리더가 있으면 줄어듭니다.` });
    }
    const machines = P.weigh.concat(P.mix, P.pack);
    if (uBrk < 0.06 * mods.breakdown && machines.length) {
      const m = machines[Math.floor(mBrk * machines.length)], t0 = Math.round(30 + tBrk * (dayMin - 90)), d = 60 + Math.round(dBrk * 90);
      down.push({ id: m.id, from: t0, to: t0 + d, label: '고장' });
      s.totals.breakdowns++;
      events.push({ t: t0, tone: 'bad', text: `${m.def.name} 고장으로 ${d}분 정지. 설비 엔지니어가 있으면 줄어듭니다.` });
    }
    if (s.inspectToday) {
      if (uAud < mods.audit) events.push({ t: 60, tone: 'good', text: '식약처 점검 통과.' });
      else { down.push({ id: 'all', from: 60, to: 180, label: '시정 조치' }); eventCost += 10000000; events.push({ t: 60, tone: 'bad', text: `점검에서 지적을 받아 2시간 시정 조치, 벌금 ${won(10000000)}.` }); }
    }
    s.inspectToday = false;

    const res = PT.simulate(P, s.plan, { dayMin, start: s.lastSku, record: true, down });
    s.lastSku = Object.assign({}, s.lastSku, res.endLast);
    Object.keys(res.produced).forEach(k => (s.fg[k] = (s.fg[k] || 0) + res.produced[k]));

    // 출고
    let revenue = 0, cogs = 0, penalty = 0;
    const shipped = [], canceled = [];
    s.orders.filter(o => o.status === 'open').sort((a, b) => a.due - b.due || a.id.localeCompare(b.id)).forEach(o => {
      const late = Math.max(0, s.day - o.due);
      if ((s.fg[o.sku] || 0) >= o.kg) {
        s.fg[o.sku] -= o.kg;
        const k = PT.SKU[o.sku];
        revenue += o.value; cogs += o.kg * k.unitCost; penalty += late * PT.LATE_RATE * o.value;
        o.status = 'shipped'; o.late = late; o.shippedDay = s.day;
        s.totals[late ? 'late' : 'onTime']++;
        const st = s.skuStats[o.sku] = s.skuStats[o.sku] || { kg: 0, revenue: 0, cogs: 0, change: 0, days: 0 };
        st.kg += o.kg; st.revenue += o.value; st.cogs += o.kg * k.unitCost;
        shipped.push(o);
      } else if (late >= PT.CANCEL_AFTER || (s.day >= PT.MAX_DAY && o.due <= s.day)) {
        penalty += 0.1 * o.value;
        o.status = 'canceled'; o.late = late; s.totals.canceled++;
        canceled.push(o);
      }
    });
    const stOf = k => (s.skuStats[k] = s.skuStats[k] || { kg: 0, revenue: 0, cogs: 0, change: 0, clean: 0, days: 0 });
    Object.keys(res.changeBySku).forEach(k => (stOf(k).change += res.changeBySku[k]));
    Object.keys(res.cleanBySku).forEach(k => (stOf(k).clean = (stOf(k).clean || 0) + res.cleanBySku[k]));
    s.enabled.forEach(k => { const st = s.skuStats[k] = s.skuStats[k] || { kg: 0, revenue: 0, cogs: 0, change: 0, days: 0 }; st.days++; });

    // 계약 정산
    const c = s.contract;
    if (c && c.active) {
      const miss = s.orders.filter(o => o.contract && o.due === s.day && o.status !== 'shipped').length;
      if (miss) { c.missed += miss; penalty += 3000000 * miss; events.push({ tone: 'bad', text: `계약 물량을 못 맞췄습니다. 위약금 ${won(3000000 * miss)}.` }); }
      if (s.day >= c.end + 1) {
        c.active = false;
        if (!c.missed) { revenue += 25000000; s.totals.contractOk++; events.push({ tone: 'good', text: `${c.cust} 계약을 완수해 보너스 ${won(25000000)}를 받았습니다.` }); }
        else events.push({ tone: 'warn', text: `${c.cust} 계약 종료. ${c.missed}일 못 지켜 보너스는 없습니다.` });
      }
    }

    // 손익
    const fp = G.fixedParts(s);
    const ot = G.otCost(s);
    const wheat = G.effect(s, 'wheat') ? Object.keys(res.produced).reduce((a, k) => a + res.produced[k] * (PT.SKU[k].bom.flour || 0) * PT.RAW.flour.price * 0.25, 0) : 0;
    const extra = s.dayExtra + eventCost + wheat;
    const clean = res.cleanCost;
    const opProfit = revenue - cogs - penalty - fp.wages - fp.mgr - fp.overhead - fp.maint - fp.sku - ot - clean - extra;
    const producedCost = Object.keys(res.produced).reduce((a, k) => a + res.produced[k] * PT.SKU[k].unitCost, 0);
    s.cash += revenue - penalty - producedCost - fp.wages - fp.mgr - fp.overhead - fp.maint - fp.sku - ot - clean - eventCost - wheat;
    s.profitCum += opProfit;

    const busy = list => PT.busyOf(res, list);
    const stageBusy = { weigh: busy(P.weigh), mix: busy(P.mix), pack: busy(P.pack), move: s.transport ? res.moveBusy / (s.transport * res.dayEnd) : 0 };
    if (res.ibc) { stageBusy.wash = busy(P.wash); stageBusy.cont = res.ibc.short / res.dayEnd; }
    const bottleneck = Object.keys(stageBusy).reduce((a, k) => (stageBusy[k] > stageBusy[a] ? k : a), 'weigh');
    const change = P.mix.concat(P.pack).reduce((a, m) => a + (res.stat[m.id] ? res.stat[m.id].change : 0), 0);
    const demand = s.orders.filter(o => o.day === s.day).reduce((a, o) => a + o.kg, 0);
    s.totals.producedKg += res.total; s.totals.revenue += revenue; s.totals.change += change;
    if (res.total > 0 && res.wetMin === 0) s.totals.dryDays++;

    // 관리직 만족도
    s.managers.forEach(m => {
      let d = -0.4 + PT.TRAITS[m.trait].sat;
      if (m.role === 'analyst' || m.role === 'food' || m.role === 'all') d -= Math.max(0, s.enabled.length - 6) * 0.8;
      if (m.role === 'engineer' || m.role === 'all') d -= Math.max(0, s.machines.length - 10) * 0.4;
      if (m.role === 'leader') d -= Math.max(0, G.headcount(s) - 16) * 0.3;
      if (s.overtime) d -= 1.5;
      if (opProfit > 0) d += 0.4;
      m.sat = clamp(m.sat + d, 0, 100);
    });

    const report = {
      day: s.day, res, P, shipped, canceled, stageBusy, bottleneck, change, demand, events, wet: res.wetMin, wetCount: res.wetCount,
      pl: { revenue, cogs, penalty, wages: fp.wages, mgr: fp.mgr, ot, overhead: fp.overhead, maint: fp.maint, sku: fp.sku, clean, extra, opProfit },
    };
    report.ceo = G.ceo(s, report);
    s.history.push({ day: s.day, revenue, opProfit, produced: res.total, demand, bottleneck, change, wet: res.wetMin, ot: s.overtime, skus: s.enabled.length });
    events.forEach(e => log(s, e.text, e.tone));
    log(s, `${s.day}일차: 생산 ${(res.total / 1000).toFixed(1)}톤, 출고 ${shipped.length}건, 영업이익 ${won(opProfit)}.`, opProfit >= 0 ? 'good' : 'bad');

    if (s.cash < -300000000) s.over = 'bankrupt';
    else if (s.day >= PT.MAX_DAY) s.over = 'done';
    else { s.day += 1; G.startDay(s); }
    if (s.over) s.badges = G.badges(s);
    return report;
  };

  // ── 품목별 진짜 이익 (전환·세척 시간과 품목 관리비를 배분) ───
  G.skuReport = function (s) {
    const fp = G.fixedParts(s);
    const perMin = (fp.wages + fp.mgr + fp.overhead + fp.maint) / PT.SHIFT_MIN;
    const fee = PT.SKU_FEE * PT.mods(s).skuFee;
    return Object.keys(s.skuStats).map(id => {
      const st = s.skuStats[id], k = PT.SKU[id];
      const surface = st.revenue - st.cogs;
      const changeCost = st.change * perMin + (st.clean || 0), feeCost = st.days * fee;
      return { id, k, kg: st.kg, revenue: st.revenue, surface, margin: st.kg ? surface / st.kg : 0, change: st.change, changeCost, feeCost, real: surface - changeCost - feeCost, on: s.enabled.includes(id) };
    }).sort((a, b) => b.real - a.real);
  };

  // ── 사장님 한마디 ───────────────────────────────
  G.ceo = function (s, rep) {
    const r = PT.rng(s.seed, s.day, 'ceo')();
    const b = rep.stageBusy, bnBusy = b[rep.bottleneck];
    const lines = [];
    if (rep.pl.opProfit < 0) lines.push('손해 보면서 공장 돌리는 건 봉사활동이야. 병목부터 다시 보자고.');
    if (rep.canceled.length) lines.push('고객이 주문을 취소했다고? 납기는 신뢰야. 무리하게 받은 건 아닌가?');
    if (rep.wet > 90) lines.push(`믹서가 오늘 습식 세척만 ${Math.round(rep.wet)}분 했다던데. 품목이 너무 많은 거 아니야?`);
    if (rep.bottleneck === 'move' && bnBusy > 0.8) lines.push('운반하는 친구들이 하루 종일 뛰어다니더군. 컨베이어나 슈트 얘기 좀 해볼까?');
    if (Math.max(b.weigh, b.mix, b.pack) < 0.5 && rep.res.total > 0) lines.push('설비가 반은 놀던데. 영업을 더 하든가, 투자를 줄였어야지.');
    if (s.enabled.length >= 8) lines.push(`품목이 ${s.enabled.length}개라고? 영업팀은 좋아하겠지만, 공장장은 머리가 아프겠네.`);
    if (rep.pl.opProfit > 4000000) lines.push(r < 0.5 ? '좋아! 이대로만 가자. 근데 방심은 금물이야.' : '오늘 숫자 좋네. 회식은 다음 달에 생각해보지.');
    if (!lines.length) lines.push(r < 0.5 ? '수고했어. 내일도 부탁해.' : '나쁘지 않아. 병목 하나만 더 잡아보자고.');
    return lines[Math.floor(r * lines.length)];
  };

  // ── 등급·업적·결과 코드 ──────────────────────────
  const GRADES = ['S', 'A', 'B', 'C', 'D'];
  const LABEL = { S: '공장 설계의 달인', A: '믿고 맡기는 공장장', B: '안정적인 공장', C: '돌아가긴 하는 공장', D: '다시 설계' };
  G.grade = function (s) {
    const pb = G.payback(s), ot = G.otif(s);
    const pi = pb <= 10 ? 0 : pb <= 14 ? 1 : pb <= 20 ? 2 : pb <= 30 ? 3 : 4;
    const si = ot >= 0.9 ? 0 : ot >= 0.85 ? 1 : ot >= 0.75 ? 2 : ot >= 0.6 ? 3 : 4;
    const g = GRADES[Math.max(pi, si)];
    return { g, label: LABEL[g], pay: GRADES[pi], service: GRADES[si], rank: Math.max(pi, si) };
  };
  G.badges = function (s) {
    const gr = G.grade(s), t = s.totals, out = [];
    const chutes = Object.values(s.links).filter(l => l.kind === 'chute').length;
    if (!t.accidents && s.day >= PT.MAX_DAY) out.push('safe');
    if (t.onTime >= 10 && !t.late && !t.canceled) out.push('otif');
    if (G.payback(s) <= 10) out.push('pay10');
    if (chutes >= 3) out.push('gravity');
    if (s.enabled.length <= 5 && gr.rank <= 2) out.push('lean');
    if (s.managers.length >= 3 && !t.quits) out.push('people');
    if (t.dryDays >= 10) out.push('dry');
    if (G.hasIbc(s) && s.ibcCount && G.otif(s) >= 0.9) out.push('ibc');
    if (t.contractOk) out.push('promise');
    if (gr.g === 'S') out.push('top');
    return out;
  };
  const hash = str => { let h = 7; for (let i = 0; i < str.length; i++) h = (Math.imul(h, 31) + str.charCodeAt(i)) >>> 0; return h.toString(36).slice(-4); };
  G.resultCode = function (s) {
    const gr = G.grade(s);
    const d = { sc: s.scen, nk: s.nick || '익명', g: gr.g, pb: isFinite(G.payback(s)) ? Math.round(G.payback(s) * 10) / 10 : 999, ot: Math.round(G.otif(s) * 100),
      pr: Math.round(s.profitCum / 1e4), iv: Math.round(s.invested / 1e4), sk: s.enabled.length, bd: s.badges.length };
    const body = btoa(unescape(encodeURIComponent(JSON.stringify(d)))).replace(/=+$/, '');
    return `PT-${body}.${hash(body)}`;
  };
  G.readCode = function (code) {
    const m = String(code).trim().match(/^PT-([A-Za-z0-9+/]+)\.([a-z0-9]{1,4})$/);
    if (!m || hash(m[1]) !== m[2]) return null;
    try { return JSON.parse(decodeURIComponent(escape(atob(m[1])))); } catch (e) { return null; }
  };

  // ── 튜토리얼 (첫 공장) ────────────────────────────
  G.TUT = [
    { stage: 'raw', text: '원료 랙을 1층 입고장(왼쪽 노란 표시) 옆에 놓으세요. 원료는 1층으로 들어옵니다.', rect: [1, 1, 3, 2, 3] },
    { stage: 'weigh', text: '수동 계량대를 원료 랙 오른쪽에 놓으세요. 원료 랙과 가까울수록 원료를 가지러 가는 시간이 짧습니다.', rect: [1, 4, 4, 2, 1] },
    { stage: 'mix', text: '리본 믹서 1,000kg을 계량대 오른쪽에 놓으세요.', rect: [1, 7, 4, 2, 2] },
    { stage: 'pack', text: '지대 포장기를 믹서 오른쪽에 놓으세요.', rect: [1, 11, 4, 2, 2] },
    { stage: 'fg', text: '제품 랙을 1층 출고장(오른쪽) 옆에 놓으세요.', rect: [1, 15, 3, 2, 3] },
    { stage: 'trial', text: '아래 [시운전]을 눌러 하루를 돌려보세요. 끝나면 화면 아래 미터에서 노란 테두리가 병목입니다.' },
    { stage: 'tweak', text: '병목 설비를 눌러 작업자 수나 이송 방식을 바꿔보세요. 버튼 옆 숫자가 "하루 능력이 얼마나 변하는지"입니다.' },
    { stage: 'open', text: '준비됐으면 [개업하기]. 개업 후에도 설비는 언제든 바꿀 수 있습니다.' },
  ];
  G.tutStep = function (s) {
    if (!s.tut) return null;
    const P = PT.compile(s);
    const has = st => P[st] && P[st].length;
    let i = 0;
    for (; i < G.TUT.length; i++) {
      const st = G.TUT[i].stage;
      if (['raw', 'weigh', 'mix', 'pack', 'fg'].includes(st) && has(st)) continue;
      if (st === 'trial' && s.tut.trial) continue;
      if (st === 'tweak' && s.tut.tweak) continue;
      if (st === 'open' && s.phase === 'run') continue;
      break;
    }
    s.tut.step = i;
    return i < G.TUT.length ? Object.assign({ i }, G.TUT[i]) : null;
  };

  // ── 개업 ────────────────────────────────────────
  G.open = function (s) {
    const P = PT.compile(s);
    if (PT.validate(s, P).length) return false;
    s.phase = 'run'; s.day = 1;
    log(s, '공장 문을 열었습니다. 오늘부터 주문이 들어옵니다.', 'good');
    G.startDay(s);
    return true;
  };

  G.clone = s => JSON.parse(JSON.stringify(s));
})();
</script>
<script>
/* 프리믹스 타이쿤 — 도트 공장 화면 (캔버스)
 * 내부 해상도로 그린 뒤 배율로 키워 픽셀 느낌을 낸다. 4개 층을 위에서부터 쌓아 보여주고, 한 층만 크게 볼 수도 있다.
 */
'use strict';
(function () {
  const V = PT.view = {};
  const T = 16;
  const WALL_TOP = 24, WALL_SIDE = 16, WALL_BOT = 8, GAP = 12, MARGIN = 30;
  const BLOCK_W = PT.GRID.w * T + WALL_SIDE * 2;
  const BLOCK_H = WALL_TOP + PT.GRID.h * T + WALL_BOT;
  V.T = T;
  V.BLOCK_W = BLOCK_W;
  V.MARGIN = MARGIN;

  // 캔버스 세계는 테마와 무관한 고정 팔레트
  const C = {
    bg: '#1C2226', asphalt: '#2A3136', lane: '#59636A', floor: '#C9CFC6', floorAlt: '#C2C8BF', grid: '#B6BCB3',
    wallTop: '#9AA3A9', wallFront: '#646D74', wallLine: '#394146', wallLight: '#B4BCC1',
    steelHi: '#F1F4F5', steel: '#D3D9DC', steelMid: '#AEB6BA', steelDark: '#7F888D', line: '#3E464B',
    blue: '#3D72A8', orange: '#E0892E', orangeDark: '#A9611B', green: '#53D46B', red: '#E5483B',
    yellow: '#F5C21B', hazard: '#26261F', water: '#5AA9E6', waterLight: '#BFE1F7',
    kraft: '#C99B5F', kraftDark: '#9C7140', sack: '#E8D7AE', sackDark: '#C6B285', rack: '#D2702C', rackDark: '#8E4A1C',
    skin: '#EBB98E', white: '#FAFAF7', whiteShade: '#D9DCD6', boot: '#4E565B', vest: '#F07F23', apron: '#3E7FC1', suit: '#38465A', hair: '#2B2522',
    belt: '#4A5156', beltLight: '#6E777C', pipe: '#E2E7EA', pipeDark: '#8F989D', wood: '#B98A5A', woodDark: '#8A6038', screen: '#7FD3F0',
    truck: '#E9ECEE', truckDark: '#9AA3A9', cab: '#3D72A8',
    ghostOk: 'rgba(83, 212, 107, 0.35)', ghostBad: 'rgba(229, 72, 59, 0.38)', select: '#F5C21B', hint: '#F5C21B',
    shadow: 'rgba(20, 26, 30, 0.22)',
  };
  V.C = C;

  // ── 배치 계산 ────────────────────────────────────
  // cols 2: 넓은 화면에서 4·3층을 위, 2·1층을 아래에 두 줄로
  V.layout = function (s, view, cols) {
    const blocks = [];
    const floors = view ? [view] : [4, 3, 2, 1];
    const c = view ? 1 : (cols || 1);
    floors.forEach((f, i) => {
      const col = i % c, row = Math.floor(i / c);
      const x0 = MARGIN + col * (BLOCK_W + MARGIN), y = 6 + row * (BLOCK_H + GAP);
      blocks.push({ floor: f, x0, y, ix: x0 + WALL_SIDE, iy: y + WALL_TOP });
    });
    V.blocks = blocks;
    V.width = c * BLOCK_W + (c + 1) * MARGIN;
    V.height = 6 + Math.ceil(floors.length / c) * (BLOCK_H + GAP) - GAP + 6;
    V.cols = c;
    return blocks;
  };
  V.size = (view, cols) => {
    const c = view ? 1 : cols, n = view ? 1 : 4;
    return { w: c * BLOCK_W + (c + 1) * MARGIN, h: 12 + Math.ceil(n / c) * (BLOCK_H + GAP) - GAP };
  };
  const blockOf = f => V.blocks.find(b => b.floor === f);
  V.tileToPx = (floor, x, y) => { const b = blockOf(floor); return b ? { x: b.ix + x * T, y: b.iy + y * T } : null; };
  V.hit = function (px, py) {
    for (const b of V.blocks) {
      if (px >= b.ix && px < b.ix + PT.GRID.w * T && py >= b.iy && py < b.iy + PT.GRID.h * T) {
        return { floor: b.floor, x: Math.floor((px - b.ix) / T), y: Math.floor((py - b.iy) / T) };
      }
    }
    return null;
  };
  V.centerPx = m => { const c = PT.center(m), b = blockOf(m.floor); return b ? { x: b.ix + c.x * T, y: b.iy + c.y * T } : null; };
  V.machineRect = m => { const f = PT.fp(m), b = blockOf(m.floor); return b ? { x: b.ix + f.x * T, y: b.iy + f.y * T, w: f.w * T, h: f.h * T } : null; };

  // ── 이송 경로 ────────────────────────────────────
  V.path = function (a, b, kind) {
    const A = V.centerPx(a), B = V.centerPx(b);
    if (kind === 'chute' || (kind === 'auto' && a.floor !== b.floor)) return A && B ? { pts: [A, B], w: [1] } : null;
    if (a.floor === b.floor) {
      if (!A) return null;
      const mid = { x: B.x, y: A.y };
      return { pts: [A, mid, B], w: [Math.abs(B.x - A.x) + 0.01, Math.abs(B.y - A.y) + 0.01] };
    }
    if (!A || !B) return null;
    if (kind === 'pneumatic') {
      const rx = blockOf(a.floor).ix + (PT.ELEVATOR.x + PT.ELEVATOR.w) * T + 6;
      const p1 = { x: rx, y: A.y }, p2 = { x: rx, y: B.y };
      return { pts: [A, p1, p2, B], w: [Math.abs(rx - A.x) + 1, Math.abs(B.y - A.y) + 1, Math.abs(B.x - rx) + 1] };
    }
    const dA = V.tileToPx(a.floor, PT.ELEV_DOOR.x, PT.ELEV_DOOR.y), dB = V.tileToPx(b.floor, PT.ELEV_DOOR.x, PT.ELEV_DOOR.y);
    const m1 = { x: dA.x, y: A.y }, m2 = { x: dB.x, y: B.y };
    const ride = PT.ELEV_MIN * Math.abs(a.floor - b.floor) / 0.25 * T;
    return {
      pts: [A, m1, dA, Object.assign({ hide: true }, dB), m2, B],
      w: [Math.abs(m1.x - A.x) + 0.01, Math.abs(dA.y - m1.y) + 0.01, ride, Math.abs(m2.y - dB.y) + 0.01, Math.abs(B.x - m2.x) + 0.01],
    };
  };
  function along(path, f) {
    const total = path.w.reduce((a, b) => a + b, 0);
    let d = Math.max(0, Math.min(1, f)) * total;
    for (let i = 0; i < path.w.length; i++) {
      if (d <= path.w[i] || i === path.w.length - 1) {
        const p = path.pts[i], q = path.pts[i + 1], k = Math.min(1, d / path.w[i]);
        return { x: p.x + (q.x - p.x) * k, y: p.y + (q.y - p.y) * k, hide: !!q.hide && k < 1 };
      }
      d -= path.w[i];
    }
    return path.pts[path.pts.length - 1];
  }

  // ── 그리기 도구 ──────────────────────────────────
  let ctx = null;
  const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
  const outline = (x, y, w, h, c) => { R(x, y, w, 1, c); R(x, y + h - 1, w, 1, c); R(x, y, 1, h, c); R(x + w - 1, y, 1, h, c); };
  function box(x, y, w, h, fh, top, front, line) {
    R(x + 1, y + h - 1, w - 1, 2, C.shadow);
    R(x, y, w, h - fh, top);
    R(x, y + h - fh, w, fh, front);
    outline(x, y, w, h, line || C.line);
    R(x + 1, y + 1, w - 2, 1, 'rgba(255,255,255,0.35)');
  }
  function hazard(x, y, w, h, t, a, b) {
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    R(x, y, w, h, a);
    const off = Math.floor(t * 0.5) % 6;
    for (let i = -h - 6; i < w + 6; i += 6) for (let j = 0; j < h; j++) R(x + i + j + off, y + j, 3, 1, b);
    ctx.restore();
  }
  function tote(x, y, color, n) {
    for (let i = 0; i < (n || 1); i++) {
      const ty = y - i * 4;
      R(x, ty, 7, 6, C.line);
      R(x + 1, ty + 1, 5, 2, shade(color, 1.15));
      R(x + 1, ty + 3, 5, 2, color);
    }
  }
  function shade(hex, k) {
    const n = parseInt(hex.slice(1), 16);
    const f = v => Math.max(0, Math.min(255, Math.round(v * k)));
    return '#' + ((1 << 24) + (f(n >> 16) << 16) + (f((n >> 8) & 255) << 8) + f(n & 255)).toString(16).slice(1);
  }
  V.shade = shade;

  // 사람 7×11 도트: 작업자(위생복), 관리직(정장)
  const PERSON = ['..hhh..', '.hhhhh.', '..sss..', '..sss..', '.uuuuu.', 'uuaaauu', 'uuaaauu', 'u.aaa.u', '..uuu..', '..b.b..', '..b.b..'];
  const STEP = ['..b..b.', '.b...b.'];
  function person(x, y, kind, frame, carry) {
    const pal = kind === 'mgr' ? { h: C.hair, s: C.skin, u: C.suit, a: C.white, b: C.line }
      : { h: C.white, s: C.skin, u: C.white, a: kind === 'move' ? C.vest : C.apron, b: C.boot };
    x = Math.round(x - 3); y = Math.round(y - 10);
    R(x + 1, y + 10, 6, 2, C.shadow);
    PERSON.forEach((row, j) => {
      const line = j >= 9 && frame ? STEP[(frame + j) % 2] : row;
      for (let i = 0; i < 7; i++) { const k = line[i]; if (k !== '.') R(x + i, y + j, 1, 1, pal[k]); }
    });
    if (kind !== 'mgr') R(x, y + 4, 7, 1, C.whiteShade);
    if (carry) tote(x + 6, y + 4, carry);
  }

  // IBC 컨테이너: 철제 케이지 안의 2,000L 탱크와 팔레트. fill = 내용물 색, dirty = 쓰고 남은 가루
  function ibcBox(x, y, fill, dirty) {
    x = Math.round(x); y = Math.round(y);
    R(x + 1, y + 10, 10, 2, C.shadow);
    R(x, y + 9, 10, 2, C.woodDark);
    R(x, y, 10, 10, C.steelDark);
    R(x + 1, y + 1, 8, 8, C.white);
    if (fill) { R(x + 1, y + 3, 8, 6, fill); R(x + 1, y + 3, 8, 1, shade(fill, 1.2)); }
    if (dirty) { R(x + 1, y + 6, 8, 3, '#A89A80'); R(x + 2, y + 5, 3, 1, '#A89A80'); }
    R(x + 3, y + 1, 1, 8, 'rgba(62,70,75,0.45)'); R(x + 6, y + 1, 1, 8, 'rgba(62,70,75,0.45)');
    R(x + 4, y - 1, 2, 1, C.line);
  }
  function miniIbc(x, y, fill, dirty) {
    x = Math.round(x); y = Math.round(y);
    R(x, y, 7, 7, C.steelDark); R(x + 1, y + 1, 5, 5, C.white);
    if (fill) R(x + 1, y + 3, 5, 3, fill);
    if (dirty) R(x + 1, y + 4, 5, 2, '#9C8F78');
    R(x, y + 7, 7, 1, C.woodDark);
  }
  V.ibcBox = ibcBox;
  // 지게차 (위에서 본 모습). dir 1 = 오른쪽으로 감, load = 컨테이너 색 / 'empty' / 'dirty' / null
  function forklift(x, y, dir, load) {
    x = Math.round(x); y = Math.round(y);
    R(x - 5, y + 4, 11, 2, C.shadow);
    const fx = dir > 0 ? x + 4 : x - 6;
    R(x - 4, y - 3, 8, 7, C.orange); R(x - 4, y + 3, 8, 1, C.orangeDark);
    R(x - 2, y - 2, 4, 4, C.line); R(x - 1, y - 1, 2, 2, C.skin);
    R(fx, y - 4, 2, 9, C.steelDark);
    if (load) miniIbc(dir > 0 ? x + 6 : x - 13, y - 4, load === 'empty' || load === 'dirty' ? null : load, load === 'dirty');
    else { R(dir > 0 ? x + 6 : x - 9, y - 2, 4, 1, C.steelDark); R(dir > 0 ? x + 6 : x - 9, y + 2, 4, 1, C.steelDark); }
  }

  // ── 설비 그림 ────────────────────────────────────
  const DRAW = {
    rawRack(x, y, w, h) {
      R(x + 1, y + h - 1, w - 1, 2, C.shadow);
      for (let i = 0; i < 3; i++) {
        const ly = y + 3 + i * Math.floor((h - 6) / 3);
        R(x + 2, ly + 10, w - 4, 2, C.rack);
        for (let k = 0; k < Math.floor((w - 6) / 7); k++) {
          R(x + 4 + k * 7, ly + 3, 6, 7, C.sackDark); R(x + 4 + k * 7, ly + 3, 6, 5, C.sack); R(x + 5 + k * 7, ly + 5, 4, 1, C.kraftDark);
        }
      }
      R(x + 1, y + 2, 2, h - 4, C.rackDark); R(x + w - 3, y + 2, 2, h - 4, C.rackDark);
    },
    fgRack(x, y, w, h, st) {
      R(x + 1, y + h - 1, w - 1, 2, C.shadow);
      const fill = st.fill && st.fill.length ? st.fill : [C.kraft];
      const slots = 3 * Math.floor((w - 8) / 6);
      const n = st.n === undefined ? slots : Math.min(slots, st.n);
      let idx = 0;
      for (let i = 2; i >= 0; i--) {
        const ly = y + 3 + i * Math.floor((h - 6) / 3);
        R(x + 2, ly + 11, w - 4, 2, C.rack);
        R(x + 4, ly + 9, w - 8, 2, C.kraftDark);
        for (let k = 0; k < Math.floor((w - 8) / 6); k++, idx++) {
          if (idx >= n) continue;
          const c = fill[idx % fill.length];
          R(x + 5 + k * 6, ly + 3, 5, 6, shade(c, 0.85)); R(x + 5 + k * 6, ly + 3, 5, 4, c);
        }

      if (m.type === 'ibcDock' && snap && snap.docks[m.id]) { st.cont = true; st.color = PT.SKU[snap.docks[m.id]].color; }
      if (m.type === 'ibcWasher') { st.pool = snap ? snap.pool : (anim ? 0 : s.ibcCount || 0); st.dirty = snap ? snap.dirty.length : 0; }
      if (m.type === 'fgRack') { st.fill = opts.fgColors; if (anim) st.n = (pallets[m.id] || 0) + 2; }
      if (m.type === 'office') { st.people = [seat < s.managers.length, seat + 1 < s.managers.length]; st.on = st.people[0] || st.people[1]; seat += 2; }
      if (m.type === 'rawLift') st.t = anim ? t : 0;
      V.drawMachineAt(m.type, r.x, r.y, r.w, r.h, st);
      if (iv) overlay(r, iv, t);
      else if (PT.EQUIP[m.type].crew > 0 && !m.crew) noCrewMark(r);
      const crew = Math.min(m.crew || 0, 3);
      for (let i = 0; i < crew; i++) {
        const busy = iv && !['idle', 'nocrew', 'down'].includes(iv.st);
        person(r.x + 6 + i * 8, r.y + r.h + 6, 'op', busy && Math.floor(t * 2 + i) % 2 ? 1 : 0, null);
      }
      if (sel === m.id) { ctx.save(); ctx.setLineDash([3, 2]); ctx.strokeStyle = C.select; ctx.strokeRect(r.x - 1.5, r.y - 1.5, r.w + 3, r.h + 3); ctx.restore(); }
      if (opts.hover === m.id && sel !== m.id) outline(r.x - 1, r.y - 1, r.w + 2, r.h + 2, 'rgba(255,255,255,0.7)');
    });

    if (P) P.links.forEach(l => {
      if (l.kind !== 'chute') return;
      if (opts.view) chutePort(l, byId); else drawLink(l, byId, t, sel && (l.from === sel || l.to === sel));
    });

    // 트럭 (재생 중): 아침 원료 입고, 오후 제품 출고
    const b1 = blockOf(1);
    if (anim && b1) {
      const dy = b1.iy + PT.DOCK_IN.y * T + 10;
      const lx = b1.x0 - MARGIN, rx = b1.x0 + BLOCK_W + MARGIN;
      if (t < 34) { const k = t < 8 ? t / 8 : t > 26 ? (34 - t) / 8 : 1; truck(lx - 26 + k * 28, dy, 1, Math.max(0, 6 - Math.floor(t / 4))); }
      const end = anim.res.dayEnd;
      if (t > end - 60) { const k = t < end - 50 ? (t - end + 60) / 10 : 1; truck(rx - k * 28, dy, -1, Math.min(6, Math.floor((t - end + 50) / 6))); }
    }

    // 운반 작업자
    if (P) {
      const busyW = new Set();
      if (anim) anim.res.transfers.forEach(tr => { if (tr.w >= 0 && tr.s <= t && tr.we > t) busyW.add(tr.w); });
      const door = V.tileToPx(1, PT.ELEV_DOOR.x, PT.ELEV_DOOR.y);
      if (door) for (let i = 0; i < s.transport; i++) if (!busyW.has(i)) person(door.x - 14 - i * 8, door.y + 18, 'move', 0, null);
    }
    if (anim) {
      anim.res.transfers.forEach(tr => {
        if (tr.s > t || tr.we <= t) return;
        const a = byId[tr.from], b = byId[tr.to];
        if (!a || !b) return;
        let path;
        if (tr.via && byId[tr.via]) {
          // 믹서 → 서지 호퍼 → 포장기: 두 구간을 이어 붙인다
          const h = byId[tr.via], k = tr.kinds || [tr.kind, 'auto'];
          const p1 = V.path(a, h, k[0]), p2 = V.path(h, b, k[1]);
          path = p1 && p2 ? { pts: p1.pts.concat(p2.pts.slice(1)), w: p1.w.concat(p2.w) } : null;
        } else path = V.path(a, b, tr.kind);
        if (!path) return;
        const color = tr.lift ? C.sack : PT.SKU[tr.sku].color;
        if (tr.fork) {
          // 지게차: 갈 때는 컨테이너를 싣고, 올 때는 빈 포크로
          const go = t < tr.e, pth = go ? path : { pts: path.pts.slice().reverse(), w: path.w.slice().reverse() };
          const f = go ? (t - tr.s) / Math.max(0.01, tr.e - tr.s) : (t - tr.e) / Math.max(0.01, tr.we - tr.e);
          const p = along(pth, f), q = along(pth, Math.min(1, f + 0.02));
          if (!p.hide) forklift(p.x, p.y, q.x < p.x - 0.01 ? -1 : 1, go ? (tr.empty ? 'empty' : tr.dirty ? 'dirty' : color) : null);
          return;
        }
        if (t < tr.e) {
          const p = along(path, (t - tr.s) / Math.max(0.01, tr.e - tr.s));
          if (p.hide) return;
          if (tr.w >= 0) person(p.x, p.y + 4, 'move', Math.floor(t * 3) % 2 + 1, color); else tote(p.x - 3, p.y - 3, color);
        } else if (tr.w >= 0) {
          const back = { pts: path.pts.slice().reverse(), w: path.w.slice().reverse() };
          const p = along(back, (t - tr.e) / Math.max(0.01, tr.we - tr.e));
          if (!p.hide) person(p.x, p.y + 4, 'move', Math.floor(t * 3) % 2 + 1, null);
        }
      });
    }

    // 튜토리얼이 권하는 자리
    if (opts.hint && !opts.ghost) {
      const [f, x, y, w, h] = opts.hint, p = V.tileToPx(f, x, y);
      if (p) {
        const blink = Math.floor((opts.clock || 0) * 2) % 2;
        ctx.save(); ctx.setLineDash([4, 3]); ctx.strokeStyle = blink ? C.hint : 'rgba(245,194,27,0.45)'; ctx.lineWidth = 2;
        ctx.strokeRect(p.x + 1, p.y + 1, w * T - 2, h * T - 2); ctx.restore();
      }
    }
    // 배치 미리보기
    if (opts.ghost && opts.ghost.floor) {
      const g = opts.ghost, d = PT.EQUIP[g.type];
      const w = (g.rot ? d.h : d.w) * T, h = (g.rot ? d.w : d.h) * T;
      const p = V.tileToPx(g.floor, g.x, g.y);
      if (p) {
        ctx.globalAlpha = 0.75; V.drawMachineAt(g.type, p.x, p.y, w, h, {}); ctx.globalAlpha = 1;
        R(p.x, p.y, w, h, g.ok ? C.ghostOk : C.ghostBad); outline(p.x, p.y, w, h, g.ok ? C.green : C.red);
      }
    }
  };

  function overlay(r, iv, t) {
    const led = { work: C.green, mix: C.green, pack: C.green, wash: C.green, cwait: '#8E979C', clean: C.yellow, wet: C.water, change: C.yellow, hold: C.red, wait: '#8E979C', lift: '#8E979C', idle: '#5B6469', nocrew: C.red, down: C.red }[iv.st];
    R(r.x + r.w - 6, r.y + 3, 4, 4, C.line);
    R(r.x + r.w - 5, r.y + 4, 2, 2, (iv.st === 'clean' || iv.st === 'change' || iv.st === 'wet' || iv.st === 'down') && Math.floor(t * 2) % 2 ? C.line : led);
    if (iv.st === 'clean' || iv.st === 'change') hazard(r.x + 2, r.y + r.h - 6, r.w - 4, 4, t * 4, C.yellow, C.hazard);
    if (iv.st === 'wet') {
      hazard(r.x + 2, r.y + r.h - 6, r.w - 4, 4, t * 4, C.water, C.waterLight);
      for (let i = 0; i < 4; i++) { const dx = (i * 7 + Math.floor(t * 6)) % Math.max(1, r.w - 6); R(r.x + 3 + dx, r.y + 5 + ((i * 5 + Math.floor(t * 8)) % Math.max(1, r.h - 12)), 1, 2, C.water); }
    }
    if (iv.st === 'down') {
      hazard(r.x + 2, r.y + r.h - 6, r.w - 4, 4, 0, C.red, C.hazard);
      const x = r.x + r.w / 2 - 3, y = r.y + 3;
      R(x, y, 7, 9, C.red); R(x + 3, y + 2, 1, 4, C.white); R(x + 3, y + 7, 1, 1, C.white);
    }
    const sku = iv.sku ? PT.SKU[iv.sku] : null;
    if (iv.st === 'hold' && sku) tote(r.x + r.w - 2, r.y + r.h - 8, sku.color);
    if (iv.q > 0) tote(r.x - 8, r.y + r.h - 8, '#9AA3A9', Math.min(iv.q, 4));
    if (iv.st === 'nocrew') noCrewMark(r);
  }
  function noCrewMark(r) {
    const x = r.x + r.w / 2 - 4, y = r.y + 2;
    R(x, y, 9, 9, C.red); R(x + 2, y + 2, 1, 1, C.white); R(x + 6, y + 2, 1, 1, C.white);
    R(x + 3, y + 3, 3, 3, C.white); R(x + 2, y + 6, 1, 1, C.white); R(x + 6, y + 6, 1, 1, C.white);
  }

  // 사장님 얼굴 (모달용 작은 초상화)
  const BOSS = [
    '...hhhhhh...', '..hhhhhhhh..', '.hhssssssh..', '.hssssssss..', '.sseessees..', '.ssssssssss.',
    '..ssmmmmss..', '...ssssss...', '..wwttttww..', '.wwwwttwwww.', 'wwwwwttwwwww', 'wwwwwttwwwww',
  ];
  V.bossPortrait = function () {
    const c = document.createElement('canvas');
    c.width = 12; c.height = 12;
    ctx = c.getContext('2d');
    const pal = { h: '#5A5F66', s: C.skin, e: '#2B2522', m: '#9E5B4B', w: '#2F3A4A', t: '#C8452F' };
    BOSS.forEach((row, j) => { for (let i = 0; i < 12; i++) if (row[i] !== '.') R(i, j, 1, 1, pal[row[i]]); });
    return c.toDataURL();
  };
})();
</script>
<script>
/* 프리믹스 타이쿤 — 화면 조작 */
'use strict';
(function () {
  const G = PT.game, V = PT.view;
  const $ = q => document.querySelector(q);
  const SAVE_KEY = 'premix-tycoon-v3', BOARD_KEY = 'premix-tycoon-board', NICK_KEY = 'premix-tycoon-nick';
  const SPEEDS = [0, 0.5, 1, 2, 4];
  const ui = PT.ui = { tab: 'build', mode: null, sel: null, hover: null, ghost: null, anim: null, ana: null, today: null, cache: {}, confirm: null, view: null, speed: 1 };
  let S = null;

  // ── 표기 ────────────────────────────────────────
  const esc = v => String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const won = G.won;
  const ton = kg => (Math.round(kg / 100) / 10).toLocaleString('ko-KR') + '톤';
  const kgf = kg => (kg >= 1000 ? ton(kg) : Math.round(kg).toLocaleString('ko-KR') + 'kg');
  const pct = v => Math.round(v * 100) + '%';
  const clock = m => { const t = PT.DAY_START_MIN + Math.round(m); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); };
  const dur = m => { m = Math.round(m); const h = Math.floor(m / 60), r = m % 60; return h ? (r ? `${h}시간 ${r}분` : `${h}시간`) : `${r}분`; };
  const STAGE = { weigh: '계량', mix: '혼합', pack: '포장', move: '운반', wash: '컨테이너 세척', cont: '컨테이너' };
  const ST_NAME = { work: '계량 중', mix: '혼합 중', pack: '포장 중', clean: '건식 청소', wet: '습식 세척·검증', change: '규격·필름 교체', hold: '막힘 · 뒤 공정 대기', wait: '굶음 · 앞 공정 대기', lift: '원료 올리는 중', wash: '컨테이너 세척 중', cwait: '빈 컨테이너 기다림', idle: '쉬는 중', nocrew: '작업자 없음', down: '정지' };
  const UNIT = { move: '명', cont: '개' };
  const chip = c => `<span class="chip" style="--c:${c}"></span>`;
  const delta = (a, b) => { const d = b - a; return d === 0 ? '변화 없음' : `${d > 0 ? '+' : '−'}${ton(Math.abs(d))}`; };
  const stars = n => '★'.repeat(n) + '☆'.repeat(3 - n);
  // 추천 배치 두 가지: 싸고 무난한 1층 라인 / 빠르지만 고정비가 드는 4층 낙하 타워
  const QUICK_PICK = `<div class="quick-pick">
    <button class="btn small" data-a="quick" data-kind="flat">추천 배치: 1층 라인</button>
    <button class="btn small ghost" data-a="quick" data-kind="tower">추천 배치: 4층 타워</button></div>
    <p class="small muted">1층 라인은 컨베이어로 한 층에 깔아 싸고 고정비가 낮습니다. 4층 타워는 계량→믹서→호퍼→포장기를 낙하 슈트로 내려 믹서가 1.5배 빨라지지만, 원료 리프트와 층 관리비가 듭니다. 주문이 능력을 넘칠 때는 타워, 아니면 1층이 유리합니다.</p>`;

  // ── 저장 ────────────────────────────────────────
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 저장 불가 환경 */ } },
  };
  const save = () => store.set(SAVE_KEY, S);
  const load = () => { const v = store.get(SAVE_KEY); return v && v.v === 3 ? v : null; };

  function changed() { ui.cache = {}; ui.ana = null; ui.today = null; save(); }
  function analysis() { if (!ui.ana) ui.ana = PT.analyze(S); return ui.ana; }
  function today() { if (S.phase !== 'run') return null; if (!ui.today) ui.today = G.preview(S, false); return ui.today; }
  function whatIf(key, mutate) {
    if (ui.cache[key]) return ui.cache[key];
    const c = G.clone(S);
    c.cash = 1e13;
    mutate(c);
    const base = analysis(), next = PT.analyze(c);
    return (ui.cache[key] = { base, next, d: (next.ok ? next.total : 0) - (base.ok ? base.total : 0) });
  }
  function whatIfText(w) {
    if (!w.next.ok) return `<span class="muted">라인이 아직 완성되지 않아 계산할 수 없습니다 (${esc(w.next.issues[0])}).</span>`;
    if (!w.base.ok) return `하루 능력 <b>${ton(w.next.total)}</b>`;
    const a = STAGE[w.base.bottleneck], b = STAGE[w.next.bottleneck];
    return `하루 능력 ${ton(w.base.total)} → <b>${ton(w.next.total)}</b> <span class="${w.d > 0 ? 'up' : w.d < 0 ? 'down' : 'flat'}">(${delta(w.base.total, w.next.total)})</span>${a !== b ? ` · 병목 ${a} → ${b}` : ''}`;
  }

  // ── 렌더 ────────────────────────────────────────
  function render() {
    if (!S) return;
    if (S.tut) G.tutStep(S);
    renderTop(); renderStageHead(); renderMeter(); renderTabs(); renderSide(); renderRunbar(); draw();
  }

  function renderTop() {
    const k = (label, val, cls) => `<div class="kpi ${cls || ''}"><span class="k-label">${label}</span><span class="k-val">${val}</span></div>`;
    const sc = G.scen(S);
    let html = k('시나리오', esc(sc.name));
    if (S.phase === 'build') {
      const a = analysis();
      html += k('자본 잔액', won(S.cash)) + k('총 투자', won(S.invested)) + k('하루 고정비', won(G.fixedPerDay(S))) + k('하루 생산 능력', a.ok ? ton(a.total) : '—');
    } else {
      // 재생 중에는 가동 전 숫자를 보여준다 (결과를 미리 알려주지 않게)
      const v = ui.anim ? ui.anim.before : null;
      const h = v ? v.hist : S.history.length, rp = v ? v.recent : G.recentProfit(S), pb = v ? v.pb : G.payback(S), ot = v ? v.otif : G.otif(S);
      html += k('일차', `${v ? v.day : S.day}<small>/${PT.MAX_DAY}</small>`) + k(ui.anim ? '시각' : '현금', ui.anim ? `<span id="kClock">${clock(ui.anim.t)}</span>` : won(S.cash), !ui.anim && S.cash < 0 ? 'neg' : '')
        + k('최근 일 영업이익', h ? won(rp) : '—', h && rp < 0 ? 'neg' : '')
        + k('투자 회수', h ? (isFinite(pb) ? pb.toFixed(1) + '개월' : '회수 불가') : '—') + k('납기 준수', h ? pct(ot) : '—');
    }
    $('#kpis').innerHTML = html;
  }

  function renderStageHead() {
    const views = [[null, '전체'], [4, '4층'], [3, '3층'], [2, '2층'], [1, '1층']];
    // 배치 중에는 손가락으로도 회전·취소할 수 있게 버튼을 공장 화면 바로 위에 둔다
    const placing = ui.mode ? `<span class="placing-bar"><b>${esc(PT.EQUIP[ui.mode.type].name)}</b> 바닥을 눌러 ${ui.mode.kind === 'move' ? '옮기기' : '설치'}
      <button class="btn small" data-a="rotate">회전</button><button class="btn small ghost light" data-a="cancel">취소</button></span>` : '';
    $('#stageHead').innerHTML = `<div class="seg dark">${views.map(([v, l]) => `<button class="${ui.view === v ? 'on' : ''}" data-a="view" data-v="${v || ''}">${l}</button>`).join('')}</div>
      ${placing || `<span class="stage-note">${ui.anim ? '설비를 누르면 지금 상태가 보입니다' : '설비를 누르면 설정, 빈 바닥은 건설 탭에서'}</span>`}`;
  }

  function renderMeter() {
    const el = $('#meter');
    if (ui.anim) {
      el.innerHTML = `<div class="meter-head"><b>${esc(ui.anim.label)}</b><span class="muted">불빛: 초록 가동 · 노랑 세척 · 파랑 습식 세척 · 빨강 막힘·정지 · 회색 대기</span></div><ul class="live" id="live"></ul>`;
      return;
    }
    const a = analysis();
    if (!a.ok) { el.innerHTML = `<div class="meter-head"><b>라인을 돌릴 수 없습니다</b></div><ul class="issues">${a.issues.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`; return; }
    const st = a.res.stat, P = a.P;
    const avg = (list, k) => list.length ? list.reduce((x, m) => x + st[m.id][k], 0) / list.length / PT.SHIFT_MIN : 0;
    const rows = a.stages.map(sg => {
      if (sg.key === 'move' && !sg.n) return '<div class="mrow"><span class="mlab">운반 <small>0명</small></span><span class="mbar"></span><span class="mval muted">—</span></div>';
      const parts = sg.key === 'move' ? [['run', sg.busy]] : sg.key === 'cont' ? [['wait', sg.busy]] : ['run', 'change', 'hold', 'wait'].map(c => [c, avg(P[sg.key], c)]);
      const isBn = sg.key === a.bottleneck;
      return `<div class="mrow ${isBn ? 'bn' : ''}"><span class="mlab">${STAGE[sg.key]} <small>${sg.n}${UNIT[sg.key] || '대'}</small>${isBn ? '<em>병목</em>' : ''}</span>
        <span class="mbar">${parts.map(([c, v]) => v > 0.004 ? `<i class="u-${c}" style="width:${(Math.min(1, v) * 100).toFixed(1)}%"></i>` : '').join('')}</span><span class="mval">${pct(sg.busy)}</span></div>`;
    }).join('');
    const tday = today();
    const crowd = P.crowd > 1 ? `<p class="meter-warn">원료 ${P.rawTypes}종인데 원료 랙 자리는 ${P.rawCap}종뿐입니다. 원료를 찾느라 계량이 1.5배 느려집니다. 원료 랙을 더 두세요.</p>` : '';
    el.innerHTML = `<div class="meter-head"><b>하루 생산 능력 ${ton(a.total)}</b><span class="muted">영업 중인 품목 ${S.enabled.length}개를 보통 주문 크기로 8시간 돌렸을 때${tday && tday.ok ? ` · 오늘 계획대로면 ${ton(tday.res.total)}` : ''}</span></div>
      <div class="mrows">${rows}</div>
      <div class="legend"><span><i class="u-run"></i>가동</span><span><i class="u-change"></i>세척·전환</span><span><i class="u-hold"></i>막힘(뒤 공정 대기)</span><span><i class="u-wait"></i>굶음(앞 공정 대기)</span></div>
      ${a.res.ibc ? `<p class="small muted">컨테이너 줄은 충전 스테이션이 깨끗한 컨테이너를 기다린 시간입니다. 길면 컨테이너나 세척기·지게차가 모자랍니다.</p>` : ''}
      ${crowd}<p class="meter-note">${meterNote(a)}</p>`;
  }
  function meterNote(a) {
    const bn = a.stages.find(s => s.key === a.bottleneck);
    // 순차 믹서와 IBC 블렌더가 함께 있으면 평균 대신 둘을 나란히 보여준다
    if (a.res.ibc && a.P.cmix.length && a.P.blend.length && ['mix', 'weigh', 'pack'].includes(bn.key)) {
      const st = a.res.stat, avg = (list, f) => list.reduce((x, m) => x + f(st[m.id]), 0) / list.length;
      const busy = list => pct(avg(list, v => (v.run + v.change) / PT.SHIFT_MIN));
      return `혼합 줄은 두 라인의 평균입니다. 고정 믹서는 가동 ${busy(a.P.cmix)} 중 세척에 ${dur(avg(a.P.cmix, v => v.change))}을 쓰고, IBC 블렌더는 가동 ${busy(a.P.blend)}에 세척이 0분입니다. 블렌더에 여유가 있으면 주문이 늘어도 받아낼 수 있습니다.`;
    }
    if (a.stages.every(s => s.busy < 0.8)) return '꽉 찬 공정 없이 서로 기다리는 시간(막힘·굶음)이 큽니다. 공정 사이 운반이 느리거나, 원료를 올리는 데 시간이 걸리는지 보세요.';
    const mixChange = a.P.mix.reduce((x, m) => x + (a.res.stat[m.id] ? a.res.stat[m.id].change : 0), 0) / Math.max(1, a.P.mix.length);
    if (bn.key === 'mix' && mixChange > 90) return `믹서가 병목이고, 하루 중 ${dur(mixChange)}을 세척에 씁니다. 품목 수를 줄이거나 CIP 믹서·설비 엔지니어로 세척 시간을 줄이세요. 아예 세척 없는 IBC 병렬 라인도 방법입니다.`;
    return {
      weigh: '계량이 가장 바쁩니다. 계량 인원을 늘리거나(2명 1.6배) 계량대를 하나 더 두면 라인 전체가 빨라집니다.',
      mix: '믹서가 가장 바쁩니다. 믹서를 한 대 더 두거나 쟁기형 고속 믹서를, 위층에서 슈트로 떨어뜨리면 투입·배출이 빨라집니다.',
      pack: '포장기가 가장 바쁩니다. 고속 포장기로 바꾸거나 한 대 더 두세요. 앞 공정에 돈을 써도 생산량은 늘지 않습니다.',
      move: a.res.ibc ? '운반 작업자(지게차 기사)가 쉴 틈이 없습니다. IBC 컨테이너는 한 배치에 지게차가 네 번 움직입니다. 기사를 늘리거나 설비 사이 거리를 줄이세요.' : '운반 작업자가 쉴 틈이 없습니다. 작업자를 늘리거나 컨베이어·슈트로 바꾸면 다른 설비가 덜 기다립니다.',
      wash: '컨테이너 세척기가 쉬지 못합니다. 알러겐·진한 색 품목은 습식 세척이라 오래 걸립니다. 세척기를 하나 더 두거나 컨테이너를 늘려 세척을 기다리는 동안 쓸 여유를 만드세요.',
      cont: '충전 스테이션이 빈 컨테이너를 자주 기다립니다. 컨테이너를 더 사거나, 세척기·지게차가 컨테이너를 늦게 돌려주는지 보세요.',
    }[bn.key];
  }

  // ── 탭 ──────────────────────────────────────────
  function renderTabs() {
    const pending = S.morning.filter(c => c.choices && !c.done).length;
    const tabs = [['build', '건설'], ['machine', '설비'], ['sales', '영업'], ['hr', '인사'], ['books', '장부']];
    $('#tabs').innerHTML = tabs.map(([id, l]) => `<button class="tab ${ui.tab === id ? 'on' : ''}" data-a="tab" data-tab="${id}" ${ui.anim ? 'disabled' : ''}>${l}${id === 'machine' && ui.sel ? ' ●' : ''}${id === 'sales' && pending ? ` <span class="badge">${pending}</span>` : ''}</button>`).join('');
  }
  function renderSide() { $('#side').innerHTML = { build: sideBuild, machine: sideMachine, sales: sideSales, hr: sideHR, books: sideBooks }[ui.tab](); }

  const thumbs = {};
  function thumb(type) { if (!thumbs[type]) { const c = document.createElement('canvas'); V.drawThumb(c, type); thumbs[type] = c.toDataURL(); } return thumbs[type]; }
  const img = type => { const d = PT.EQUIP[type]; return `<img src="${thumb(type)}" alt="" width="${(d.w * V.T + 4) * 2}" height="${(d.h * V.T + 4) * 2}">`; };
  function specLine(d) {
    if (d.stage === 'weigh' && d.ibc) return `컨테이너에 바로 계량 · 속도 ×${d.speed} · ${d.crew}명(최대 ${d.crewMax})`;
    if (d.stage === 'mix' && d.ibc) return `컨테이너 ${d.cap.toLocaleString()}kg · 세척 없음 · 물리고 풀기 ${PT.IBC.dock}분`;
    if (d.stage === 'dock') return '포장기에 맞닿게 또는 바로 위층';
    if (d.stage === 'wash') return `건식 ${PT.IBC.wash.dry}분 · 습식 ${PT.IBC.wash.wet}분 · ${d.crew}명`;
    if (d.stage === 'weigh') return `속도 ×${d.speed} · ${d.crew}명${d.crewMax > d.crew ? `(최대 ${d.crewMax})` : ''}`;
    if (d.stage === 'mix') return `${d.cap.toLocaleString()}kg · 혼합 ×${d.mixMul} · 세척 ×${d.clean}${d.wetMin ? ' · 습식 30분' : ''}`;
    if (d.stage === 'pack') return Object.keys(d.rate).map(f => `${f === 'bulk' ? '지대' : '파우치'} ${d.rate[f]}봉/분`).join(' · ') + ` · ${d.crew}명 · 규격변경 ${d.fmtChange}분/회`;
    if (d.stage === 'buffer') return `대기 +${d.slots}배치`;
    if (d.stage === 'office') return `관리직 ${d.seats}자리`;
    if (d.stage === 'lift') return '1층 전용';
    return d.floor ? `${d.floor}층 전용` : `원료 ${PT.RACK_TYPES}종`;
  }

  // 시나리오 6: 기존 라인 위에 얹는 증설안 두 가지를 눌러보고 비교한다
  function addonPick() {
    if (S.phase !== 'build') return '';
    const added = S.machines.some(m => !m.legacy) || S.ibcCount > 0;
    if (added) return `<div class="quick-pick"><button class="btn small ghost" data-a="undoAddon">증설 되돌리기 (전액 회수)</button></div>`;
    const cost = kind => { const c = G.clone(S), before = c.cash; G.addOn(c, kind); return before - c.cash; };
    const row = (kind, label, cls) => {
      const w = whatIf('addon:' + kind, c => G.addOn(c, kind));
      return `<button class="btn small ${cls}" data-a="addon" data-kind="${kind}">${label} · ${won(cost(kind))}</button><span class="small">${whatIfText(w)}</span>`;
    };
    return `<div class="quick-pick addon">${row('line2', '증설안 A: 순차 라인 하나 더', '')}${row('ibc', '증설안 B: IBC 병렬 라인', 'ghost')}</div>
      <p class="small muted">두 안 모두 2층에 얹고 1층 포장기를 같이 씁니다. A는 싸지만 믹서 두 대가 모두 품목이 바뀔 때마다 세척에 묶입니다. B는 비싸지만 블렌더가 세척 없이 돌고, 대신 컨테이너 개수·세척기·지게차 기사가 새 판단거리입니다. 눌러보고 시운전으로 비교한 뒤 마음에 안 들면 되돌리세요. 직접 배치해도 됩니다.</p>`;
  }

  function sideBuild() {
    const placing = ui.mode && ui.mode.kind === 'place' ? ui.mode : null;
    const sc = G.scen(S);
    let head = '';
    const step = S.tut ? G.tutStep(S) : null;
    if (placing) {
      const d = PT.EQUIP[placing.type], g = ui.ghost;
      head = `<div class="placing"><div><b>${d.name} 배치 중</b> <span class="muted">${won(d.cost)}</span></div>
        <p class="muted small">공장 바닥을 눌러 놓으세요. R 키나 아래 버튼으로 회전, Esc나 오른쪽 클릭으로 취소.</p>
        <p class="preview">${g && g.ok && g.what ? whatIfText(g.what) : (g && !g.ok ? `<span class="down">${esc(g.why)}</span>` : '바닥 위에 올리면 생산 능력 변화를 미리 계산합니다.')}</p>
        <div class="row"><button class="btn small ghost" data-a="rotate">회전</button><button class="btn small ghost" data-a="cancel">취소</button></div></div>`;
    } else if (step) {
      head = `<div class="tut"><p class="eyebrow">안내 ${step.i + 1} / ${G.TUT.length}</p><p>${esc(step.text)}</p>
        ${step.rect ? '<p class="small muted">공장 화면에 노란 점선으로 권하는 자리를 표시했습니다. 그대로 따라 하지 않아도 됩니다.</p>' : ''}
        ${!S.machines.length ? '<button class="btn small" data-a="quick">안내 건너뛰고 추천 배치로 시작</button>' : ''}</div>`;
    } else if (S.phase === 'build') {
      head = `<div class="guide"><b>${esc(sc.name)}</b> <span class="muted">${esc(sc.learn)}</span><p class="small">${esc(sc.goal)}</p>
        ${!S.machines.length ? QUICK_PICK : ''}
        ${sc.prebuilt ? addonPick() : ''}
        <p class="small">원료는 1층으로 들어오고 제품은 1층에서 나갑니다. 위층에 계량, 아래층에 믹서·포장을 겹쳐 놓으면 낙하 슈트로 사람 없이 내려보낼 수 있습니다. 대신 위층 원료 랙은 원료를 올려야 합니다(운반 작업자 또는 원료 리프트).</p></div>`;
    }
    const groups = PT.EQUIP_GROUPS.map(([gname, types]) => `<section class="cat"><h3>${gname}</h3>${types.map(type => {
      const d = PT.EQUIP[type], on = placing && placing.type === type;
      return `<button class="item ${on ? 'on' : ''}" data-a="pick" data-type="${type}" ${S.cash >= d.cost ? '' : 'disabled'} title="${esc(d.desc)}">
        ${img(type)}<span class="item-body"><b>${d.name}</b><span class="item-spec">${specLine(d)}</span><span class="item-desc">${d.desc}</span></span>
        <span class="item-price">${won(d.cost)}<small>${d.w}×${d.h}칸</small></span></button>`;
    }).join('')}</section>`).join('');
    const wT = whatIf('transport+', c => G.setTransport(c, c.transport + 1));
    const used = G.usedFloors(S);
    const showIbc = G.hasIbc(S) || S.ibcCount > 0;
    const wC = showIbc ? whatIf('ibc+', c => G.setIbc(c, c.ibcCount + 1)) : null;
    return `${head}
      <section class="cat"><h3>건물·운반</h3>
        <div class="opt"><div><b>4층 건물 · 사용 중 ${used}개 층</b><span class="muted small">1층 외에 설비를 둔 층마다 하루 ${won(PT.FLOOR_OVERHEAD)} (조명·공조·청소)</span></div></div>
        <div class="opt"><div><b>운반 작업자 ${S.transport}명</b><span class="muted small">수동 운반·원료 올리기${showIbc ? '·IBC 지게차' : ''}를 맡습니다. 1인 일급 ${won(PT.WAGE)}</span><span class="small">한 명 더: ${whatIfText(wT)}</span></div>
          <div class="stepper"><button class="icon-btn" data-a="transport" data-d="-1" ${S.transport <= 0 ? 'disabled' : ''}>−</button><output>${S.transport}</output><button class="icon-btn" data-a="transport" data-d="1">+</button></div></div>
        ${showIbc ? `<div class="opt"><div><b>IBC 컨테이너 ${S.ibcCount}개</b><span class="muted small">2,000L(약 1톤) · 개당 ${won(PT.IBC.cost)}. 충전·혼합·대기·배출·세척 중인 컨테이너가 한 개씩 차지합니다.</span><span class="small">한 개 더: ${whatIfText(wC)}</span></div>
          <div class="stepper"><button class="icon-btn" data-a="ibc" data-d="-1" ${S.ibcCount <= 0 ? 'disabled' : ''}>−</button><output>${S.ibcCount}</output><button class="icon-btn" data-a="ibc" data-d="1" ${S.cash < PT.IBC.cost ? 'disabled' : ''}>+</button></div></div>` : ''}
      </section>${groups}`;
  }

  function sideMachine() {
    const m = ui.sel && G.byId(S, ui.sel);
    if (!m) return '<p class="empty">공장 화면에서 설비를 누르면 사양, 인원, 이송 방식을 바꿀 수 있습니다.</p>';
    const d = PT.EQUIP[m.type], a = analysis(), stat = a.ok && a.res.stat[m.id];
    let crewHtml = '';
    if (d.crew > 0) {
      const max = d.crewMax || d.crew;
      const wPlus = m.crew < max ? whatIf('crew+' + m.id, c => G.setCrew(c, m.id, m.crew + 1)) : null;
      crewHtml = `<div class="opt"><div><b>작업자 ${m.crew}명</b><span class="muted small">정격 ${d.crew}명${max > d.crew ? ` · 최대 ${max}명` : ''}</span>${wPlus ? `<span class="small">한 명 더: ${whatIfText(wPlus)}</span>` : ''}</div>
        <div class="stepper"><button class="icon-btn" data-a="crew" data-d="-1" ${m.crew <= 0 ? 'disabled' : ''}>−</button><output>${m.crew}</output><button class="icon-btn" data-a="crew" data-d="1" ${m.crew >= max ? 'disabled' : ''}>+</button></div></div>`;
    }
    const statHtml = stat ? `<div class="mini-util">${['run', 'change', 'hold', 'wait', 'idle'].map(k => stat[k] > 0.5 ? `<i class="u-${k}" style="width:${(stat[k] / PT.SHIFT_MIN * 100).toFixed(1)}%"></i>` : '').join('')}</div>
      <p class="small muted">표준 주문 기준 가동 ${pct((stat.run + stat.change) / PT.SHIFT_MIN)} · 세척 ${dur(stat.change)} · 막힘 ${dur(stat.hold)} · 굶음 ${dur(stat.wait)}</p>` : '';
    let extra = '';
    if (m.type === 'office') {
      const idx = S.machines.filter(x => x.type === 'office').indexOf(m);
      const seated = S.managers.slice(idx * 2, idx * 2 + 2);
      extra = `<p class="small">${seated.length ? seated.map(x => `${esc(x.name)} (${PT.ROLES[x.role].name})`).join(', ') + ' 근무 중' : '빈 사무실입니다. 인사 탭에서 관리직을 채용하세요.'}</p>`;
    }
    if (m.type === 'rawRack' && m.floor > 1) extra = `<p class="small warn-t">${m.floor}층 원료 랙입니다. ${analysis().P.lift.length ? '원료 리프트가 자동으로 올려줍니다.' : '원료 리프트가 없어 배치마다 운반 작업자가 입고장에서 원료를 엘리베이터로 올립니다.'}</p>`;
    const refund = Math.round(m.paid * G.refundRate(S));
    return `<div class="sel-head">${img(m.type)}<div><h2>${d.name}</h2><p class="muted small">${m.floor}층 · ${specLine(d)}</p></div></div>
      <p class="small">${d.desc}</p>${extra}${statHtml}${crewHtml}${linksHtml(m)}
      <div class="row end"><button class="btn small ghost" data-a="move">${S.phase === 'build' ? '옮기기·회전' : `옮기기 · ${won(PT.MOVE_COST)}`}</button>
        <button class="btn small ghost danger" data-a="sell">${ui.confirm === 'sell:' + m.id ? '한 번 더 누르면 매각' : `매각 · ${won(refund)} 회수`}</button></div>`;
  }
  function linksHtml(m) {
    const P = analysis().P, d = PT.EQUIP[m.type], pairs = [];
    const add = (a, b, label) => pairs.push({ a, b, label });
    const nm = x => `${x.floor}층 ${PT.EQUIP[x.type].name}`;
    let note = '';
    // 포장기 앞에 서지 호퍼가 있으면 믹서는 호퍼로 보낸다
    const toPack = (x, p, label) => { if (p.hop) add(x, p.hop, label + ` (서지 호퍼 경유)`); else add(x, p, label); };
    if (d.stage === 'raw') P.weigh.forEach(w => add(m, w, '→ ' + nm(w)));
    // IBC 설비는 지게차로만 잇는다 (충전 스테이션은 원료 랙 경로만 고를 수 있음)
    if (d.ibc || d.stage === 'dock' || d.stage === 'wash') {
      if (d.stage === 'weigh') P.raw.forEach(r => add(r, m, '원료 ← ' + nm(r)));
      return (pairs.length ? linkRows(pairs, '') : '') + forkRows(m, P);
    }
    if (d.stage === 'weigh') {
      P.raw.forEach(r => add(r, m, '원료 ← ' + nm(r)));
      P.cmix.forEach(x => add(m, x, '→ ' + nm(x)));
      if (P.cweigh.length > 1) note = `계량대 ${P.cweigh.length}대가 나란히 일합니다. 믹서마다 다음 배치를 ${Math.min(3, P.cweigh.length)}개까지 미리 받아둡니다.`;
    }
    if (d.stage === 'mix') {
      P.cweigh.forEach(w => add(w, m, '← ' + nm(w)));
      P.pack.forEach(p => toPack(m, p, '→ ' + nm(p)));
      const pm = P.byId[m.id];
      if (P.cweigh.length > 1) note = `계량대 ${P.cweigh.length}대가 이 믹서에 번갈아 보냅니다. 다음 배치를 ${pm.inCap}개까지 미리 받아둡니다.`;
    }
    if (d.stage === 'pack') {
      const pp = P.byId[m.id];
      if (pp.hop) {
        note = `앞에 ${nm(pp.hop)}가 붙어 있어 믹서 → 호퍼 → 포장기로 흐릅니다. 대기 자리 ${pp.slots}배치.`;
        P.cmix.forEach(x => add(x, pp.hop, '← ' + nm(x) + ' (호퍼로)'));
        if (pp.hop.toPack.kind !== 'auto') add(pp.hop, m, '← 서지 호퍼');
      } else P.cmix.forEach(x => add(x, m, '← ' + nm(x)));
      if (pp.dock) note = (note ? note + ' ' : '') + `위에 ${nm(pp.dock)}이 있어 IBC 컨테이너도 받습니다.`;
      P.fg.forEach(f => add(m, f, '→ ' + nm(f)));
    }
    if (d.stage === 'fg') P.pack.forEach(p => add(p, m, '← ' + nm(p)));
    if (d.stage === 'buffer') {
      const h = P.hop.find(x => x.id === m.id), target = h && h.feeds && P.byId[h.feeds];
      const choose = P.pack.length ? `<div class="opt"><div><b>붙일 포장기</b><span class="muted small">포장기에 맞닿게 두거나 바로 위층에 겹치면 자동 투입(1분)</span></div>
        <div class="seg">${P.pack.map(p => `<button class="${target && target.id === p.id ? 'on' : ''}" data-a="feeds" data-id="${p.id}">${p.floor}층 ${esc(PT.EQUIP[p.type].name)}</button>`).join('')}</div></div>` : '<p class="small down">붙일 포장기가 없습니다.</p>';
      if (target) {
        P.cmix.forEach(x => add(x, m, '← ' + nm(x)));
        if (h.toPack && h.toPack.kind !== 'auto') add(m, target, '→ ' + nm(target));
        note = h.toPack && h.toPack.kind === 'auto' ? `${nm(target)}에 붙어 있어 중력으로 바로 투입합니다(1분).` : `${nm(target)}와 떨어져 있습니다. 아래에서 호퍼 → 포장기 이송 방식을 고르세요.`;
        if (target.hop && target.hop.id !== m.id) note = `${nm(target)}에는 이미 다른 호퍼가 붙어 있어 이 호퍼는 대기 자리만 늘립니다.`;
      }
      return `${choose}${linkRows(pairs, note)}`;
    }
    return linkRows(pairs, note);
  }
  // IBC 설비: 지게차 동선(고를 것은 없고, 거리·층이 곧 시간)
  function forkRows(m, P) {
    // 배출 스테이션은 여러 개일 수 있으니 어느 포장기 위인지 붙인다
    const nm = x => { const f = P.byId[x.id] && P.byId[x.id].feeds, p = PT.EQUIP[x.type].stage === 'dock' && f && P.byId[f]; return `${x.floor}층 ${PT.EQUIP[x.type].name}${p ? `(${PT.EQUIP[p.type].name} 위)` : ''}`; };
    const d = PT.EQUIP[m.type];
    let note = '';
    if (d.stage === 'dock') {
      const pm = P.byId[m.id], target = pm.feeds && P.byId[pm.feeds];
      note = target ? `${nm(target)}로 바로 내려보냅니다.` : '아래나 옆에 붙은 포장기가 없습니다. 포장기에 맞닿게 두거나 바로 위층에 겹쳐 두세요.';
    }
    if (d.stage === 'mix') note = '블렌더는 IBC 충전 스테이션에서 채운 컨테이너만 받습니다. 섞은 컨테이너는 옆 대기 자리에 내려놓고, 배출 스테이션이 비면 지게차가 가져갑니다.';
    if (d.stage === 'wash') note = `깨끗한 컨테이너는 이 옆에서 대기합니다(지금 ${S.ibcCount}개). 컨테이너 개수는 건설 탭에서 정합니다.`;
    if (!P.ibcOn) return `<section class="cat"><h3>지게차 동선</h3>${note ? `<p class="small">${esc(note)}</p>` : ''}<p class="small warn-t">IBC 라인이 아직 완성되지 않았습니다. 충전 스테이션, 블렌더, 세척기, 포장기에 붙은 배출 스테이션, 컨테이너, 운반 작업자(지게차 기사)가 모두 있어야 돕니다.</p></section>`;
    const rows = P.forks.filter(l => l.from === m.id || l.to === m.id).map(l => `<li><span>${esc(nm(P.byId[l.from]))} → ${esc(nm(P.byId[l.to]))}</span>
      <small class="muted">이송시간 ${l.time.toFixed(1)}분/회 · 기사 ${l.worker.toFixed(1)}분/회 묶임${l.df ? ` · 엘리베이터 ${l.df}개 층` : ''}</small></li>`).join('');
    return `<section class="cat"><h3>지게차 동선</h3>${note ? `<p class="small">${esc(note)}</p>` : ''}
      <p class="small muted">컨테이너는 배치 하나에 세척기 → 충전 → 블렌더 → 배출 → 세척기로 지게차가 네 번 옮깁니다. 설비끼리 가깝고 같은 층일수록 기사가 덜 묶입니다.</p>
      <ul class="forks">${rows}</ul></section>`;
  }
  function linkRows(pairs, note) {
    if (!pairs.length) return note ? `<p class="small">${esc(note)}</p>` : '';
    const rows = pairs.map(({ a, b, label }) => {
      const key = a.id + '>' + b.id, cur = S.links[key] ? S.links[key].kind : 'manual';
      const opts = Object.keys(PT.LINKS).map(kind => {
        const info = PT.linkInfo(kind, a, b);
        const paid = S.links[key] ? S.links[key].paid * G.refundRate(S) : 0;
        const cost = kind === 'manual' ? 0 : info.cost, on = cur === kind;
        const lbl = a.type === 'rawRack' && kind === 'manual' ? '계량 작업자가 직접 가지러 감'
          : kind === 'manual' ? `이송시간 ${info.time.toFixed(1)}분/회</small><small>운반원 ${info.worker.toFixed(1)}분/회 묶임` : `이송시간 ${info.time.toFixed(1)}분/회`;
        let eff = '';
        if (info.ok && !on) { const w = whatIf(`link:${key}:${kind}`, c => G.setLink(c, a.id, b.id, kind)); if (w.base.ok && w.next.ok) eff = `<small class="${w.d > 0 ? 'up' : w.d < 0 ? 'down' : 'flat'}">${w.d ? delta(w.base.total, w.next.total) : '능력 그대로'}</small>`; }
        else if (on) eff = '<small class="flat">사용 중</small>';
        return `<button class="lk ${on ? 'on' : ''}" data-a="link" data-from="${a.id}" data-to="${b.id}" data-kind="${kind}" ${!info.ok || (!on && S.cash + paid < cost) ? 'disabled' : ''} title="${esc(info.ok ? PT.LINKS[kind].desc : info.why)}">
          <b>${PT.LINKS[kind].name}</b><small>${info.ok ? lbl : esc(info.why)}</small><small>${info.ok && kind !== 'manual' ? won(cost) : ''}</small>${eff}</button>`;
      }).join('');
      const r = PT.route(a, b);
      return `<div class="link"><div class="link-head"><span>${esc(label)}</span><span class="muted small">${r.df ? `${r.df}개 층 차이` : `${r.dist.toFixed(1)}칸`}</span></div><div class="lks">${opts}</div></div>`;
    }).join('');
    return `<section class="cat"><h3>이송 방식</h3>${note ? `<p class="small">${esc(note)}</p>` : ''}
      <p class="small muted">이송시간 = 배치 하나(믹서 한 번 분량)를 옮기는 시간. 수동 운반은 운반원이 비어 있을 때만 출발하고, "묶임" 시간(돌아오는 길 포함) 동안 다른 일을 못 합니다. 초록·빨강 숫자는 그 방식으로 바꿨을 때 하루 생산 능력 변화입니다.</p>${rows}</section>`;
  }

  // 영업: 품목 켜고 끄기, 주문, 생산 순서
  function sideSales() {
    const recipes = PT.RECIPES.filter(r => !r.custom || S.registered.some(id => PT.SKU[id].recipe === r.id));
    const P = analysis().P;
    const wetY = S.history.length ? S.history[S.history.length - 1].wet : 0;
    const skuRows = recipes.map(r => {
      const skus = Object.values(PT.SKU).filter(k => k.recipe === r.id);
      const k0 = skus[0];
      const tags = [k0.allergens.length ? `<span class="tag al">${k0.allergens.join('·')}</span>` : '<span class="tag ok">알러겐 없음</span>', k0.strong ? '<span class="tag dark">진한 색</span>' : ''].join('');
      return `<div class="skurow"><div class="skuname">${chip(r.color)}<b>${esc(r.name)}</b>${tags}</div><div class="packs">${skus.map(k => {
        const on = S.enabled.includes(k.id);
        return `<button class="pk ${on ? 'on' : ''}" data-a="sku" data-id="${k.id}" title="kg당 단가 ${k.price.toLocaleString()}원, 원료+포장 ${Math.round(k.unitCost).toLocaleString()}원">${PT.PACKS[k.pack].short}<small>+${Math.round(k.price - k.unitCost)}원/kg</small></button>`;
      }).join('')}</div></div>`;
    }).join('');
    const sf = G.shortfalls(S);
    const rows = sf.map(({ order: o, short }) => {
      const k = PT.SKU[o.sku], d = o.due - S.day;
      const due = d < 0 ? `<span class="due bad">지연 ${-d}일</span>` : d === 0 ? '<span class="due warn">오늘</span>' : `<span class="due">D-${d}</span>`;
      return `<tr><td>${chip(k.color)}${esc(k.name)}<div class="muted small">${esc(o.cust)}${o.contract ? ' · 계약' : ''}</div></td><td class="num">${kgf(o.kg)}</td><td>${due}</td><td class="num ${short ? 'warn-t' : 'okay'}">${short ? kgf(short) : '재고 있음'}</td></tr>`;
    }).join('');
    const plan = S.plan.map((r, i) => {
      const k = PT.SKU[r.sku];
      return `<li>${chip(k.color)}<span>${esc(k.name)} <b>${kgf(r.kg)}</b><small class="muted">${k.allergens.length ? k.allergens.join('·') : '알러겐 없음'}${k.strong ? ' · 진한 색' : ''}</small></span>
        <button class="icon-btn" data-a="up" data-i="${i}" ${i ? '' : 'disabled'}>↑</button><button class="icon-btn" data-a="down" data-i="${i}" ${i < S.plan.length - 1 ? '' : 'disabled'}>↓</button></li>`;
    }).join('');
    const tday = today(), mods = PT.mods(S);
    const rules = [['group', '묶음'], ['due', '납기순']].concat(mods.analyst >= 0.5 ? [['smart', '최적(분석가)']] : []);
    const c = S.contract;
    return `<section class="cat"><h3>영업 품목 · ${S.enabled.length}개</h3>
        <p class="small muted">켠 품목의 주문만 들어옵니다. 지대냐 파우치냐는 자유입니다. 다만 배합이 많아질수록, 특히 알러겐과 색이 다른 배합이 섞일수록 세척·관리 비용이 늘어납니다.</p>
        <div class="costline"><span>품목 관리비 <b>${won(G.skuFee(S))}</b>/일</span><span>원료 <b>${P.rawTypes}종</b> / 랙 ${P.rawCap}종</span>${S.history.length ? `<span>어제 습식 세척 <b>${dur(wetY)}</b></span>` : ''}</div>
        <div class="skus">${skuRows}</div></section>
      ${S.phase === 'run' ? `<section class="cat"><h3>${S.day}일차 출고 대기 주문</h3>
        ${c && c.active ? `<p class="small">계약: ${esc(c.cust)} · ${esc(PT.SKU[c.sku].name)} 매일 ${kgf(c.kg)} · ${c.start}~${c.end}일차 · 놓친 날 ${c.missed}일</p>` : ''}
        ${rows ? `<table class="tbl"><thead><tr><th>제품</th><th class="num">수량</th><th>납기</th><th class="num">만들 양</th></tr></thead><tbody>${rows}</tbody></table>` : '<p class="empty">대기 주문 없음</p>'}</section>
      <section class="cat"><h3>오늘 생산 순서</h3>
        <div class="opt"><div><b>순서 규칙</b><span class="muted small">묶음: 내일까지 나갈 주문끼리 같은 품목을 묶고 알러겐 적은 것부터${mods.analyst >= 0.5 ? ' · 최적: 지금 믹서 상태에서 세척이 가장 짧은 순서' : ''}</span></div>
          <div class="seg">${rules.map(([v, l]) => `<button class="${S.planRule === v ? 'on' : ''}" data-a="rule" data-v="${v}">${l}</button>`).join('')}</div></div>
        ${plan ? `<ol class="plan">${plan}</ol>` : '<p class="empty">만들 것이 없습니다.</p>'}
        ${tday && tday.ok ? `<p class="small">이 순서대로면 <b>${ton(tday.res.total)}</b> 생산 · 습식 세척 ${tday.res.wetCount}번${tday.res.leftover.length ? ` · ${ton(tday.res.leftover.reduce((x, r) => x + r.kg, 0))} 남음` : ' · 전부 완료'}</p>` : ''}
        <div class="opt"><div><b>잔업</b><span class="muted small">시급의 1.5배. 자주 하면 작업자 불만이 쌓입니다.</span></div>
          <div class="seg">${[[0, '없음'], [60, '1시간'], [120, '2시간']].map(([v, l]) => `<button class="${S.overtime === v ? 'on' : ''}" data-a="ot" data-v="${v}">${l}</button>`).join('')}</div></div>
      </section>` : '<p class="small muted">개업하면 여기서 주문과 생산 순서를 봅니다.</p>'}`;
  }

  function sideHR() {
    const seats = G.seats(S), mods = PT.mods(S);
    const mgrs = S.managers.map(m => {
      const tr = PT.TRAITS[m.trait], onboard = S.phase === 'run' && S.day - m.hired < 2;
      return `<article class="mgr"><header><b>${esc(m.name)}</b><span class="tag">${PT.ROLES[m.role].name} ${stars(m.level)}</span></header>
        <p class="small muted">${tr.name} — ${tr.desc}${onboard ? ' · 적응 중(효과 절반)' : ''}</p>
        <div class="sat"><span>만족도</span><span class="bar"><i style="width:${Math.round(m.sat)}%;background:${m.sat < 35 ? 'var(--bad)' : m.sat < 55 ? 'var(--warn)' : 'var(--ok)'}"></i></span><b>${Math.round(m.sat)}</b></div>
        <div class="row"><span class="small">일급 ${won(m.salary)}</span><span class="grow"></span>
          <button class="btn small ghost" data-a="raise" data-id="${m.id}">연봉 20% 인상</button>
          <button class="btn small ghost danger" data-a="fire" data-id="${m.id}">${ui.confirm === 'fire:' + m.id ? `한 번 더 · 위로금 ${won(m.salary * 10)}` : '내보내기'}</button></div></article>`;
    }).join('');
    const cands = S.candidates.map(c => {
      const tr = PT.TRAITS[c.trait];
      return `<article class="mgr cand"><header><b>${esc(c.name)}</b><span class="tag">${PT.ROLES[c.role].name} ${stars(c.level)}</span></header>
        <p class="small">${PT.ROLES[c.role].desc}</p><p class="small muted">${tr.name} — ${tr.desc}</p>
        <div class="row"><span class="small">일급 ${won(c.salary)} · 채용비 ${won(c.salary * 5)}</span><span class="grow"></span>
          <button class="btn small" data-a="hire" data-id="${c.id}" ${S.managers.length >= seats || S.cash < c.salary * 5 ? 'disabled' : ''}>채용</button></div></article>`;
    }).join('');
    const eff = [
      mods.speed > 1.001 ? `작업 속도 +${Math.round((mods.speed - 1) * 100)}%` : '', mods.clean < 0.999 ? `세척·전환 −${Math.round((1 - mods.clean) * 100)}%` : '',
      mods.verify < PT.VERIFY_MIN ? `알러겐 검증 ${Math.round(mods.verify)}분` : '', mods.skuFee < 0.999 ? `품목 관리비 −${Math.round((1 - mods.skuFee) * 100)}%` : '',
      mods.price > 1.001 ? `주문 단가 +${Math.round((mods.price - 1) * 100)}%` : '', mods.analyst >= 0.5 ? '품목별 진짜 이익·최적 순서' : '',
    ].filter(Boolean);
    return `<section class="cat"><h3>관리직 ${S.managers.length} / 자리 ${seats}</h3>
        ${seats ? '' : '<p class="small warn-t">사무실이 없습니다. 건설 탭에서 사무실(3×2칸, 2자리)을 지으면 채용할 수 있습니다.</p>'}
        ${eff.length ? `<p class="small">지금 효과: ${eff.join(' · ')}</p>` : ''}
        ${mgrs || '<p class="empty">아직 관리직이 없습니다.</p>'}</section>
      <section class="cat"><h3>지원자</h3><p class="small muted">5일마다 새 지원자가 옵니다. 헤드헌터에게 맡기면 바로 바뀝니다. 업무가 많거나 잔업이 이어지면 만족도가 떨어지고, 30 아래면 사직서를 냅니다.</p>
        ${cands || '<p class="empty">지원자가 없습니다.</p>'}
        <button class="btn small ghost" data-a="refresh" ${S.cash >= 3000000 ? '' : 'disabled'}>헤드헌터에게 새 지원자 받기 · 300만원</button></section>
      <section class="cat"><h3>현장 인원</h3><p class="small">반장·품질 ${PT.FIXED_CREW}명 + 설비 작업자 ${G.crewTotal(S)}명 + 운반 ${S.transport}명 = ${G.headcount(S)}명 · 일 ${won(G.headcount(S) * PT.WAGE)}</p></section>`;
  }

  function sideBooks() {
    const fp = G.fixedParts(S), h = S.history;
    const logs = S.log.slice(0, 30).map(l => `<li class="t-${l.tone}"><span class="muted">${l.day}일</span> ${esc(l.text)}</li>`).join('');
    return `<section class="cat"><h3>투자와 하루 고정비</h3><table class="tbl pl"><tbody>
        <tr><td>총 투자 (기본 공사 포함)</td><td class="num">${won(S.invested)}</td></tr>
        <tr><td>현장 인건비 (${G.headcount(S)}명)</td><td class="num">${won(fp.wages)}</td></tr>
        <tr><td>관리직 (${S.managers.length}명)</td><td class="num">${won(fp.mgr)}</td></tr>
        <tr><td>관리비 (사용 층 ${G.usedFloors(S)}개)</td><td class="num">${won(fp.overhead)}</td></tr>
        <tr><td>설비 정비</td><td class="num">${won(fp.maint)}</td></tr>
        <tr><td>품목 관리비 (${S.enabled.length}품목)</td><td class="num">${won(fp.sku)}</td></tr>
        <tr class="total"><td>합계</td><td class="num">${won(G.fixedPerDay(S))}</td></tr>
        ${h.length ? `<tr><td>최근 5일 평균 영업이익</td><td class="num">${won(G.recentProfit(S))}</td></tr><tr><td>투자 회수 기간 (월 22일)</td><td class="num">${isFinite(G.payback(S)) ? G.payback(S).toFixed(1) + '개월' : '회수 불가'}</td></tr>` : ''}
      </tbody></table></section>
      ${Object.keys(S.skuStats).length ? `<section class="cat"><h3>품목별 이익</h3>${skuTable(PT.mods(S).analyst >= 0.5)}</section>` : ''}
      ${h.length ? `<section class="cat"><h3>일별 영업이익</h3>${profitChart(h)}</section>` : ''}
      <section class="cat"><h3>공장 일지</h3><ul class="logs">${logs}</ul></section>`;
  }
  function skuTable(full) {
    const rows = G.skuReport(S).map(r => `<tr class="${full && r.real < 0 ? 'lossrow' : ''}"><td>${chip(r.k.color)}${esc(r.k.name)}${r.on ? '' : ' <span class="muted small">(중단)</span>'}</td>
      <td class="num">${ton(r.kg)}</td><td class="num">${won(r.surface)}</td>
      ${full ? `<td class="num">${dur(r.change)}</td><td class="num neg">${won(-r.changeCost - r.feeCost)}</td><td class="num ${r.real < 0 ? 'neg' : 'up'}">${won(r.real)}</td>` : '<td class="num muted" colspan="3">분석가 필요</td>'}</tr>`).join('');
    return `<div class="scroll-x"><table class="tbl"><thead><tr><th>품목</th><th class="num">출고</th><th class="num">보이는 이익</th>${full ? '<th class="num">세척·전환</th><th class="num">숨은 비용</th><th class="num">진짜 이익</th>' : '<th class="num" colspan="3">숨은 비용 · 진짜 이익</th>'}</tr></thead><tbody>${rows}</tbody></table></div>
      <p class="small muted">보이는 이익 = 매출 − 원료·포장재. 숨은 비용 = 그 품목 때문에 생긴 세척·전환 시간의 라인 비용 + 세척 직접비 + 품목 관리비.${full ? '' : ' 데이터 분석가를 채용하면 볼 수 있습니다. (게임이 끝나면 모두 공개됩니다.)'}</p>`;
  }
  function profitChart(hist) {
    const W = 340, H = 130, L = 56, T = 10, B = 20;
    const vals = hist.map(d => d.opProfit), mx = Math.max(1, ...vals), mn = Math.min(0, ...vals);
    const y = v => T + (H - T - B) * (mx - v) / (mx - mn || 1);
    const bw = (W - L - 6) / PT.MAX_DAY;
    return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="일별 영업이익">
      <line x1="${L}" x2="${W - 6}" y1="${y(0)}" y2="${y(0)}" class="zero"/>

      ${hist.map(d => { const top = y(Math.max(0, d.opProfit)), bot = y(Math.min(0, d.opProfit)); return `<rect x="${L + (d.day - 1) * bw + 1}" y="${top}" width="${bw - 2}" height="${Math.max(1, bot - top)}" class="${d.opProfit < 0 ? 'b-neg' : 'b-pos'}"><title>${d.day}일차 ${won(d.opProfit)}</title></rect>`; }).join('')}

  // ── 캔버스 ──────────────────────────────────────
  const cv = () => $('#cv');
  function drawOpts() {
    const fg = Object.keys(S.fg).filter(k => S.fg[k] > 0).map(k => PT.SKU[k].color);
    const step = S.tut && S.tut.step < G.TUT.length ? G.TUT[S.tut.step] : null;
    return { P: analysis().P, ghost: ui.ghost, selected: ui.sel, hover: ui.hover, fgColors: fg.length ? fg : null, clock: performance.now() / 500, view: ui.view, cols: ui.cols, hint: step && step.rect ? step.rect : null };
  }
  // 층은 건물 단면처럼 한 줄로 쌓는다 (4층 위 → 1층 아래)
  function chooseCols() {
    // 휴대폰에서는 처음엔 1층만 크게 (층 버튼으로 바꿀 수 있음)
    if (!ui.viewChosen && window.innerWidth < 700) { ui.view = 1; ui.viewChosen = true; }
    return 1;
  }
  function draw() {
    ui.cols = chooseCols();
    if (ui.anim) V.draw(cv(), S, { anim: ui.anim, view: ui.view, cols: ui.cols, fgColors: null });
    else V.draw(cv(), S, drawOpts());
    fitCanvas(); overlayHtml();
  }
  // 넓은 화면: 층이 너무 작아지지 않게 두 층 반쯤 보이는 크기로 키우고, 공장 화면 안에서 위아래로 스크롤
  function fitCanvas() {
    const wrap = $('#stage'), c = cv();
    const phone = window.innerWidth < 700;
    const availW = wrap.clientWidth;
    const availH = phone ? Infinity : Math.max(320, window.innerHeight - 230);
    const floorH = V.height / V.blocks.length;
    let scale = ui.view ? Math.min(availW / V.width, availH / V.height, 3) : Math.min(availW / V.width, Math.max(availH / V.height, availH / (floorH * 2.4)), 2.5);
    if (scale >= 2) scale = Math.floor(scale);
    c.style.width = V.width * scale + 'px'; c.style.height = V.height * scale + 'px';
    wrap.style.maxHeight = phone ? '' : availH + 'px';
    ui.scale = scale;
    // 처음 그릴 때는 설비가 몰리는 1층(맨 아래)이 보이게
    if (ui.scrollBottom) { wrap.scrollTop = wrap.scrollHeight; ui.scrollBottom = false; }
  }
  function overlayHtml() {
    const ov = $('#ov'), sc = ui.scale;
    let html = V.blocks.map(b => `<button class="flabel" data-a="view" data-v="${ui.view ? '' : b.floor}" style="left:${(b.x0 + 4) * sc}px;top:${(b.y + 2) * sc}px">${b.floor}층</button>`).join('');
    const b1 = V.blocks.find(b => b.floor === 1);
    if (b1) {
      const dy = (b1.iy + (PT.DOCK_IN.y + 0.2) * V.T) * sc;
      html += `<span class="dock" style="left:${(b1.x0 - V.MARGIN + 2) * sc}px;top:${dy}px">입고</span><span class="dock" style="right:${(V.width - b1.x0 - V.BLOCK_W - V.MARGIN + 2) * sc}px;top:${dy}px">출고</span>`;
    }
    ov.innerHTML = html;
    ov.style.width = cv().style.width; ov.style.height = cv().style.height;
  }
  function pointerPos(e) { const r = cv().getBoundingClientRect(); return { x: (e.clientX - r.left) / (r.width / V.width), y: (e.clientY - r.top) / (r.height / V.height) }; }
  function machineAt(px, py) {
    return S.machines.slice().sort((a, b) => b.floor - a.floor || b.y - a.y).find(m => { const r = V.machineRect(m); return r && px >= r.x && px < r.x + r.w && py >= r.y && py < r.y + r.h; });
  }
  let ghostTimer = null;
  function updateGhost(hit) {
    const md = ui.mode;
    if (!hit) { ui.ghost = null; return; }
    const d = PT.EQUIP[md.type], w = md.rot ? d.h : d.w, h = md.rot ? d.w : d.h;
    const x = Math.min(Math.max(0, hit.x - Math.floor((w - 1) / 2)), PT.GRID.w - w);
    const y = Math.min(Math.max(0, hit.y - Math.floor((h - 1) / 2)), PT.GRID.h - h);
    if (ui.ghost && ui.ghost.floor === hit.floor && ui.ghost.x === x && ui.ghost.y === y && ui.ghost.rot === md.rot) return;
    const chk = G.canPlace(S, md.type, hit.floor, x, y, md.rot, md.kind === 'move' ? md.id : null);
    ui.ghost = { type: md.type, floor: hit.floor, x, y, rot: md.rot, ok: chk.ok, why: chk.why, moving: md.kind === 'move' ? md.id : null };
    clearTimeout(ghostTimer);
    if (chk.ok) ghostTimer = setTimeout(() => {
      const g = ui.ghost;
      if (!g || !g.ok) return;
      g.what = whatIf(`${md.kind}:${md.type}:${g.floor}:${g.x}:${g.y}:${g.rot}`, c => { if (md.kind === 'move') G.move(c, md.id, g.floor, g.x, g.y, g.rot); else G.place(c, md.type, g.floor, g.x, g.y, g.rot); });
      if (ui.tab === 'build') renderSide();
    }, 90);
  }
  function bindCanvas() {
    const c = cv();
    c.addEventListener('pointermove', e => {
      if (!S) return;
      const p = pointerPos(e);
      if (ui.anim) { const m = machineAt(p.x, p.y); if (m) showTip(e, m); else hideTip(); return; }
      if (ui.mode) { updateGhost(V.hit(p.x, p.y)); draw(); hideTip(); return; }
      const m = machineAt(p.x, p.y), id = m ? m.id : null;
      if (id !== ui.hover) { ui.hover = id; draw(); }
      if (m) showTip(e, m); else hideTip();
    });
    c.addEventListener('pointerleave', () => { if (ui.hover) { ui.hover = null; if (!ui.anim) draw(); } hideTip(); });
    c.addEventListener('click', e => {
      if (!S) return;
      const p = pointerPos(e);
      if (ui.anim) { const m = machineAt(p.x, p.y); if (m) showTip(e, m); return; }
      if (ui.mode) {
        updateGhost(V.hit(p.x, p.y));
        const g = ui.ghost;
        if (!g || !g.ok) { if (g) toast(g.why); return; }
        if (ui.mode.kind === 'place') {
          const m = G.place(S, ui.mode.type, g.floor, g.x, g.y, g.rot);
          if (!m) { toast('돈이 부족합니다'); return; }
          ui.sel = m.id;
          if (S.cash < PT.EQUIP[ui.mode.type].cost || S.tut) ui.mode = null;
        } else {
          if (!G.move(S, ui.mode.id, g.floor, g.x, g.y, g.rot)) { toast('옮길 수 없습니다'); return; }
          ui.mode = null;
        }
        ui.ghost = null; changed(); render();
        return;
      }
      const m = machineAt(p.x, p.y);
      ui.sel = m ? m.id : null; ui.confirm = null;
      if (m) ui.tab = 'machine';
      render();
    });
    c.addEventListener('contextmenu', e => { if (ui.mode) { e.preventDefault(); ui.mode = null; ui.ghost = null; render(); } });
  }
  function showTip(e, m) {
    const tip = $('#tip'), d = PT.EQUIP[m.type];
    let body = `<b>${d.name}</b><span>${m.floor}층${d.crew ? ` · 작업자 ${m.crew}명` : ''}</span>`;
    if (ui.anim && ui.anim.res.intervals[m.id]) {
      const iv = V.stateAt(ui.anim.res.intervals[m.id], ui.anim.t);
      if (iv) body += `<span>${ST_NAME[iv.st] || iv.st}${iv.sku ? ` · ${PT.SKU[iv.sku].name}` : ''}</span>${iv.e > ui.anim.t && iv.e < ui.anim.res.dayEnd ? `<span>${Math.ceil(iv.e - ui.anim.t)}분 뒤 바뀜</span>` : ''}${iv.q ? `<span>앞에 대기 ${iv.q}배치</span>` : ''}`;
    } else {
      const a = analysis(), st = a.ok && a.res.stat[m.id];
      if (st) body += `<span>가동 ${pct((st.run + st.change) / PT.SHIFT_MIN)} · 막힘 ${dur(st.hold)} · 굶음 ${dur(st.wait)}</span>`;

  }
  const hideTip = () => { $('#tip').hidden = true; };

  // ── 재생 ────────────────────────────────────────
  const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function play(res, P, label, done, before) {
    ui.mode = null; ui.ghost = null;
    ui.anim = { res, P, t: 0, label, done, last: performance.now(), shown: -1, fgIds: new Set(P.fg.map(m => m.id)),
      before: before || { day: S.day, cash: S.cash, hist: S.history.length, recent: G.recentProfit(S), pb: G.payback(S), otif: G.otif(S) }, events: res.events || [] };
    if (reduceMotion()) { finish(); return; }
    render(); requestAnimationFrame(tick);
  }
  function tick(now) {
    const a = ui.anim;
    if (!a) return;
    const dt = Math.min(100, now - a.last);
    a.last = now;
    a.t += dt * 0.008 * ui.speed;   // 1배속: 8분/초 → 하루 약 1분
    if (a.t >= a.res.dayEnd) { finish(); return; }
    V.draw(cv(), S, { anim: a, view: ui.view, cols: ui.cols });
    const c1 = $('#rbClock'); if (c1) c1.textContent = clock(a.t);
    const c2 = $('#kClock'); if (c2) c2.textContent = clock(a.t);
    const pallets = a.res.transfers.filter(tr => tr.e <= a.t && a.fgIds.has(tr.to)).length;
    const evs = a.events.filter(e => e.t !== undefined && e.t <= a.t).length;
    if (pallets + evs * 1000 !== a.shown) {
      a.shown = pallets + evs * 1000;
      const live = $('#live');
      if (live) live.innerHTML = `<li>제품 랙에 들어온 팔레트 <b>${pallets}</b>개 (배치 1개 = 팔레트 1개)</li>` + a.events.filter(e => e.t !== undefined && e.t <= a.t).map(e => `<li class="t-${e.tone}">${clock(e.t)} ${esc(e.text)}</li>`).join('');
    }
    requestAnimationFrame(tick);
  }
  function finish() { const a = ui.anim; ui.anim = null; render(); if (a && a.done) a.done(); }

  function stageBars(res, P, transport) {
    const rows = ['weigh', 'mix', 'pack'].concat(res.ibc ? ['wash'] : []).map(k => {
      const list = P[k].filter(m => res.stat[m.id]), avg = key => list.length ? list.reduce((x, m) => x + res.stat[m.id][key], 0) / list.length / res.dayEnd : 0;
