<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>프리믹스 타이쿤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* 레이아웃: 위는 제어반 띠, 왼쪽은 도트 공장(층을 위에서부터 쌓음)과 라인 능력 미터, 오른쪽은 건설·설비·생산·장부 패널. 하단에 실행 바. */
:root {
  --bg: #ECEEEB;
  --surface: #FFFFFF;
  --surface-2: #F3F4F1;
  --ink: #1B2228;
  --ink-2: #4A555E;
  --muted: #6F7A83;
  --line: #D5D9D3;
  --steel: #1F2A33;
  --steel-2: #2C3943;
  --on-steel: #E8ECEA;
  --on-steel-2: #9FB0BA;
  --signal: #F5B800;
  --signal-ink: #1B1B14;
  --hazard: #23231C;
  --wet: #3A86C8;
  --ok: #2E8B57;
  --warn: #B87800;
  --bad: #C43D2E;
  --bad-soft: #F7E1DD;
  --warn-soft: #FBF0D6;
  --ok-soft: #DFF1E6;
  --run: #4F7C9A;
  --backdrop: rgba(17, 22, 26, 0.55);
  --shadow: 0 1px 2px rgba(20, 28, 34, 0.06), 0 6px 20px rgba(20, 28, 34, 0.08);

  --f-display: 'Black Han Sans', 'IBM Plex Sans KR', 'Malgun Gothic', sans-serif;
  --f-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'Consolas', monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111518; --surface: #1A2025; --surface-2: #20272D; --ink: #E5E9E6; --ink-2: #B5BEC4; --muted: #86929B;
    --line: #2D363D; --steel: #0B0F12; --steel-2: #1A2228; --on-steel: #E8ECEA; --on-steel-2: #8EA0AB;
    --signal: #F7C21C; --hazard: #101010; --wet: #4F9BDB;
    --ok: #4CB97A; --warn: #E0A62B; --bad: #EA6A58; --bad-soft: #3A2220; --warn-soft: #3A3018; --ok-soft: #18332A;
    --run: #6F9BB8; --backdrop: rgba(0, 0, 0, 0.65); --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111518; --surface: #1A2025; --surface-2: #20272D; --ink: #E5E9E6; --ink-2: #B5BEC4; --muted: #86929B;
  --line: #2D363D; --steel: #0B0F12; --steel-2: #1A2228; --on-steel: #E8ECEA; --on-steel-2: #8EA0AB;
  --signal: #F7C21C; --hazard: #101010; --wet: #4F9BDB;
  --ok: #4CB97A; --warn: #E0A62B; --bad: #EA6A58; --bad-soft: #3A2220; --warn-soft: #3A3018; --ok-soft: #18332A;
  --run: #6F9BB8; --backdrop: rgba(0, 0, 0, 0.65); --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14.5px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
[hidden] { display: none !important; }
.num { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.neg, .down { color: var(--bad); }
.up { color: var(--ok); font-weight: 600; }
.flat { color: var(--muted); }
.okay { color: var(--ok); font-weight: 600; }
.warn-t { color: var(--warn); font-weight: 600; }
.chip { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--c); margin-right: 6px; vertical-align: -1px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15); }

/* 상단 */
.top { background: var(--steel); color: var(--on-steel); border-bottom: 4px solid var(--signal); }
.top-in { max-width: 1440px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 26px; align-items: center; }
.brand { display: flex; flex-direction: column; line-height: 1.1; margin-right: auto; }
.brand-mark { font: 600 10.5px/1 var(--f-mono); letter-spacing: 0.22em; color: var(--signal); }
.brand-name { font: 400 24px/1.15 var(--f-display); }
.kpis { display: flex; flex-wrap: wrap; gap: 6px 22px; order: 1; }
.kpi { display: flex; flex-direction: column; }
.k-label { font-size: 11px; color: var(--on-steel-2); }
.k-val { font: 600 17px/1.3 var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.k-val small { font-size: 11.5px; color: var(--on-steel-2); }
.kpi.neg .k-val { color: #FF8C7A; }
.menu-btn { order: 2; background: transparent; border: 1px solid var(--steel-2); color: var(--on-steel); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; }

/* 본문 2단 */
.app { max-width: 1440px; margin: 0 auto; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 14px; align-items: start; }
.stage-card { background: var(--steel); border-radius: 12px; padding: 10px; min-width: 0; }
#stage { position: relative; display: flex; justify-content: center; align-items: flex-start; overflow-x: hidden; overflow-y: auto; scrollbar-width: thin; border-radius: 6px; }
#cv { display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair; touch-action: manipulation; }
#ov { position: absolute; top: 0; left: 50%; transform: translateX(-50%); pointer-events: none; }
.flabel { position: absolute; font: 700 11px/1 var(--f-mono); color: #F2F4F3; background: rgba(0, 0, 0, 0.45); padding: 2px 5px; border-radius: 3px; }
.dock { position: absolute; font: 600 10px/1 var(--f-body); color: #1B1B14; background: var(--signal); padding: 2px 4px; border-radius: 2px; transform: translateY(-50%); }
.expand { position: absolute; pointer-events: auto; background: transparent; border: 0; color: #C9D1D6; font-weight: 600; font-size: 13px; cursor: pointer; border-radius: 4px; }
.expand:hover:not(:disabled) { background: rgba(245, 194, 27, 0.15); color: #F5C21B; }
.expand:disabled { opacity: 0.5; cursor: default; }
#tip { position: absolute; z-index: 5; background: rgba(15, 20, 24, 0.92); color: #F2F4F3; padding: 6px 9px; border-radius: 6px; font-size: 12px; display: flex; flex-direction: column; gap: 1px; pointer-events: none; max-width: 220px; }

/* 라인 능력 미터 */
.meter { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-top: 12px; }
.meter-head { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; margin-bottom: 10px; }
.meter-head b { font-size: 16px; }
.meter-head .muted { font-size: 12.5px; }
.mrows { display: grid; gap: 7px; }
.mrow { display: grid; grid-template-columns: 112px 1fr 44px; gap: 10px; align-items: center; font-size: 13px; }
.mlab { white-space: nowrap; font-weight: 600; }
.mlab small { color: var(--muted); font-weight: 400; margin-left: 2px; }
.mlab em { font-style: normal; font-size: 10.5px; font-weight: 700; background: var(--signal); color: var(--signal-ink); padding: 0 5px; border-radius: 3px; margin-left: 6px; }
.mbar { display: flex; height: 14px; border-radius: 3px; overflow: hidden; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.mbar i, .mini-util i { display: block; height: 100%; }
.mval { font: 600 12.5px var(--f-mono); text-align: right; }
.mrow.bn .mbar { box-shadow: inset 0 0 0 2px var(--signal); }
.u-run { background: var(--run); }
.u-change { background: repeating-linear-gradient(-45deg, var(--signal) 0 3px, var(--hazard) 3px 6px); }
.u-hold { background: repeating-linear-gradient(90deg, var(--bad) 0 2px, transparent 2px 5px); }
.u-wait { background: repeating-linear-gradient(90deg, var(--muted) 0 1px, transparent 1px 4px); }
.u-idle { background: transparent; }
.legend { display: flex; flex-wrap: wrap; gap: 3px 14px; font-size: 11.5px; color: var(--muted); margin-top: 10px; }
.legend i { display: inline-block; width: 14px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; box-shadow: inset 0 0 0 1px var(--line); }
.meter-note { margin: 10px 0 0; font-size: 13px; color: var(--ink-2); max-width: 75ch; }
.issues { margin: 0; padding-left: 18px; color: var(--warn); font-size: 13.5px; }
.live { list-style: none; margin: 0; padding: 0; font-size: 13.5px; }

/* 오른쪽 패널 */
.side-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; position: sticky; top: 10px; max-height: calc(100vh - 110px); display: flex; flex-direction: column; }
.tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 8px; flex: none; }
.tab { flex: 1; background: none; border: 0; padding: 11px 6px 9px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tab.on { color: var(--ink); border-bottom-color: var(--signal); }
.tab:disabled { opacity: 0.45; cursor: default; }
#side { padding: 14px; overflow-y: auto; display: grid; gap: 14px; align-content: start; }
.cat { display: grid; gap: 8px; }
.cat h3 { font-size: 12.5px; color: var(--muted); font-weight: 700; letter-spacing: 0.04em; }
.empty { color: var(--muted); font-size: 13.5px; margin: 0; }
.guide { background: var(--warn-soft); border: 1px solid var(--signal); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; font-size: 13px; }
.guide p { margin: 0; }
.need { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 0; padding: 0; list-style: none; }
.need li::before { content: '○ '; color: var(--warn); }
.need li.done { color: var(--muted); }
.need li.done::before { content: '● '; color: var(--ok); }
.placing { border: 2px solid var(--signal); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; }
.placing p { margin: 0; }
.preview { font-size: 13.5px; }
.item { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 8px; cursor: pointer; width: 100%; }
.item:hover:not(:disabled) { border-color: var(--ink-2); }
.item.on { border-color: var(--signal); box-shadow: 0 0 0 2px var(--signal); }
.item:disabled { opacity: 0.5; cursor: default; }
.item img { image-rendering: pixelated; max-width: 64px; height: auto; justify-self: center; background: #C9CFC6; border-radius: 4px; }
.item-body { display: grid; min-width: 0; }
.item-body b { font-size: 13.5px; }
.item-spec { font-size: 11.5px; color: var(--ink-2); font-family: var(--f-mono); }
.item-desc { font-size: 11.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item-price { font: 600 12.5px var(--f-mono); text-align: right; display: grid; white-space: nowrap; }
.item-price small { font-size: 10.5px; color: var(--muted); font-weight: 400; }
.opt { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; }
.opt > div:first-child { display: grid; gap: 1px; min-width: 0; flex: 1 1 180px; }
.stepper { display: inline-flex; align-items: center; gap: 8px; }
.stepper output { font: 600 15px var(--f-mono); min-width: 22px; text-align: center; }
.icon-btn { width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: inline-grid; place-items: center; flex: none; }
.icon-btn:hover:not(:disabled) { border-color: var(--ink-2); }
.icon-btn:disabled { opacity: 0.35; cursor: default; }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.sel-head { display: flex; gap: 12px; align-items: center; }
.sel-head img { image-rendering: pixelated; max-width: 72px; height: auto; background: #C9CFC6; border-radius: 4px; }
.sel-head h2 { font-size: 17px; }
.sel-head p { margin: 2px 0 0; }
#side > p { margin: 0; }
.mini-util { display: flex; height: 10px; border-radius: 3px; overflow: hidden; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.link { border: 1px solid var(--line); border-radius: 9px; padding: 8px; display: grid; gap: 6px; }
.link-head { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 600; }
.lks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.lk { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 5px 4px; display: grid; gap: 0; text-align: center; cursor: pointer; font-size: 12px; }
.lk b { font-size: 12px; }
.lk small { font-size: 10.5px; color: var(--muted); font-family: var(--f-mono); }
.lk.on { border-color: var(--signal); box-shadow: 0 0 0 1px var(--signal); background: var(--warn-soft); }
.lk:disabled { opacity: 0.45; cursor: default; }
.plan { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; counter-reset: p; }
.plan li { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 13px; counter-increment: p; }
.plan li::before { content: counter(p); font: 600 11px var(--f-mono); color: var(--muted); width: 14px; }
.plan li > span { flex: 1; display: grid; min-width: 0; }
.plan small { font-size: 11px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; gap: 2px; background: var(--surface-2); }
.seg button { border: 0; background: transparent; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 11.5px; color: var(--muted); font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--line); }
.tbl th.num { text-align: right; }
.tbl td { padding: 6px; border-bottom: 1px solid var(--line); }
.tbl tr:last-child td { border-bottom: 0; }
.tbl.pl td { padding: 4px 6px; }
.tbl.pl tr.total td { font-weight: 700; border-top: 2px solid var(--ink); }
.due { display: inline-block; font: 600 11.5px/1.6 var(--f-mono); padding: 0 6px; border-radius: 5px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.due.warn { background: var(--warn-soft); color: var(--warn); }
.due.bad { background: var(--bad-soft); color: var(--bad); }
.logs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 12.5px; }
.logs li { padding-left: 8px; border-left: 2px solid var(--line); }
.logs .t-bad { border-left-color: var(--bad); } .logs .t-good { border-left-color: var(--ok); }
.chart { width: 100%; height: auto; display: block; }
.chart .zero { stroke: var(--ink-2); }
.chart .ax { fill: var(--muted); font: 10px var(--f-mono); }
.chart .b-pos { fill: var(--run); } .chart .b-neg { fill: var(--bad); }

/* 버튼 */
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 8px; padding: 8px 15px; font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { filter: brightness(1.15); }
.btn.small { padding: 5px 10px; font-size: 12.5px; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover:not(:disabled) { border-color: var(--ink-2); filter: none; }
.btn.ghost.light { color: var(--on-steel); border-color: var(--steel-2); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.go { background: var(--signal); color: var(--signal-ink); border: 0; padding: 10px 20px; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.22); }

/* 하단 바 */
.runbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--steel); color: var(--on-steel); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.runbar-in { max-width: 1440px; margin: 0 auto; display: flex; gap: 10px 16px; align-items: center; justify-content: space-between; }
.rb-info { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; font-size: 13.5px; color: var(--on-steel-2); min-width: 0; }
.rb-info b { color: var(--on-steel); font-family: var(--f-mono); }
.rb-info .warn-t { color: var(--signal); }
#rbClock { font-size: 19px; }
.rb-act { display: flex; gap: 8px; flex: none; }

/* 모달 */
.modal { position: fixed; inset: 0; z-index: 50; background: var(--backdrop); display: grid; place-items: center; padding: 16px; }
.modal-card { width: 100%; max-width: 560px; max-height: calc(100% - 8px); overflow-y: auto; color: var(--ink); border-radius: 14px; padding: 30px 24px 22px; box-shadow: var(--shadow);
  background: repeating-linear-gradient(-45deg, var(--signal) 0 10px, var(--hazard) 10px 20px) top / 100% 6px no-repeat, var(--surface); display: grid; gap: 12px; }
.modal-card.wide { max-width: 860px; }
.modal-card p { margin: 0; }
.eyebrow { font: 600 11.5px/1 var(--f-mono); letter-spacing: 0.14em; color: var(--muted); }
.modal-card h2 { font-size: 23px; }
.modal-act { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.start h1 { font: 400 42px/1.05 var(--f-display); }
.start { display: grid; gap: 14px; }
.start-mark { font: 600 12px/1 var(--f-mono); letter-spacing: 0.25em; color: var(--warn); }
.lede { color: var(--ink-2); max-width: 64ch; }
.strats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.strat { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px; display: grid; gap: 6px; cursor: pointer; align-content: start; }
.strat:hover { border-color: var(--signal); box-shadow: 0 0 0 2px var(--signal); }
.strat b { font-size: 17px; }
.skus { font-size: 12px; color: var(--ink-2); }
.seed { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.seed label { font-weight: 700; font-size: 13.5px; }
.seed input { width: 180px; max-width: 100%; font: 600 15px var(--f-mono); padding: 4px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); }
.seed small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.fine { font-size: 12px; color: var(--muted); }
.tips { background: var(--surface-2); border-radius: 10px; padding: 10px 14px; }
.tips h3 { font-size: 13px; margin-bottom: 4px; }
.tips ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13.5px; }
.report-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 22px; }
.report-grid h3 { font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
.mini { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
.mini li { display: flex; align-items: center; gap: 6px; }
.mini li > span:nth-child(2) { flex: 1; }
.mini b { font-family: var(--f-mono); }
.grade { display: flex; gap: 16px; align-items: center; }
.grade .g { width: 72px; height: 72px; display: grid; place-items: center; font: 400 46px/1 var(--f-display); background: var(--signal); color: var(--signal-ink); border-radius: 12px; flex: none; }
.grade .g-C, .grade .g-D { background: var(--surface-2); color: var(--ink); }
.grade p { margin: 2px 0 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13.5px; max-width: calc(100% - 32px); }

@media (max-width: 1100px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side-card { position: static; max-height: none; }
}
@media (max-width: 640px) {
  .app { padding-inline: 10px; }
  .kpis { order: 3; width: 100%; gap: 4px 14px; }
  .k-val { font-size: 14.5px; }
  .brand-name { font-size: 20px; }
  .mrow { grid-template-columns: 88px 1fr 38px; }
  .strats, .report-grid { grid-template-columns: minmax(0, 1fr); }
  .lks { grid-template-columns: repeat(2, minmax(0, 1fr)); }

<script>
/* 프리믹스 타이쿤 — 공장 시뮬레이션
 * 배치(믹서 한 번 분량)가 계량 → 믹서 → 포장기 → 제품 랙으로 흘러간다.
 * 0.25분 단위로 시간을 진행시키며 설비 상태, 이송, 운반 작업자를 추적한다.
 */
'use strict';
(function () {
  const R = PT.RULES;
  const WEIGH_CREW = [0, 1, 1.6, 2.0];

  // ── 품목: 배합 × 포장 ─────────────────────────────
  PT.SKU = {};
  PT.RECIPES.forEach(rc => {
    (PT.RECIPE_PACKS[rc.id] || ['b20', 'p1']).forEach(pk => {
      const p = PT.PACKS[pk];
      const s = {
        id: rc.id + '-' + pk, recipe: rc.id, pack: pk, name: `${rc.name} ${p.short}`, rname: rc.name, short: rc.name.replace(/ 믹스| 가루|가루/g, '').slice(0, 4),
        fmt: p.fmt, packKg: p.kg, packCost: p.cost, nIng: rc.nIng, mix: rc.mix, bom: rc.bom, color: rc.color, strong: !!rc.strong, custom: !!rc.custom,
      };
      s.allergens = Object.keys(s.bom).filter(r => PT.RAW[r].allergen).map(r => PT.RAW[r].allergen);
      s.matCost = Object.keys(s.bom).reduce((a, r) => a + s.bom[r] * PT.RAW[r].price, 0);
      s.unitCost = s.matCost + s.packCost;
      s.price = Math.round((s.unitCost + p.margin + rc.margin) / 10) * 10;
      PT.SKU[s.id] = s;
    });
  });
  PT.packLabel = s => PT.PACKS[s.pack].name;

  // ── 배치 기하 ─────────────────────────────────────
  // 'dock'은 1층 입고장을 가리키는 가상 설비 (원료 올리기 경로용)
  PT.DOCK = { id: 'dock', type: 'dock', floor: 1, x: 0, y: PT.DOCK_IN.y + 1, rot: false };
  PT.fp = function (m) {
    if (m.type === 'dock') return { x: 0, y: m.y, w: 1, h: 1 };
    const d = PT.EQUIP[m.type];
    return m.rot ? { x: m.x, y: m.y, w: d.h, h: d.w } : { x: m.x, y: m.y, w: d.w, h: d.h };
  };
  PT.center = m => { const f = PT.fp(m); return { x: f.x + f.w / 2, y: f.y + f.h / 2 }; };
  PT.ELEV_DOOR = { x: PT.ELEVATOR.x + PT.ELEVATOR.w / 2, y: PT.ELEVATOR.y + PT.ELEVATOR.h + 0.5 };
  const manhattan = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
  PT.route = function (a, b) {
    const ca = PT.center(a), cb = PT.center(b), df = Math.abs(a.floor - b.floor);
    if (!df) return { dist: manhattan(ca, cb), df: 0 };
    return { dist: manhattan(ca, PT.ELEV_DOOR) + manhattan(PT.ELEV_DOOR, cb), df };
  };
  PT.overlapXY = function (a, b) {
    const A = PT.fp(a), B = PT.fp(b);
    return A.x < B.x + B.w && B.x < A.x + A.w && A.y < B.y + B.h && B.y < A.y + A.h;
  };
  // 같은 층에서 테두리가 맞닿아 있는지
  PT.touching = function (a, b) {
    if (a.floor !== b.floor) return false;
    const A = PT.fp(a), B = PT.fp(b);
    const dx = Math.max(0, A.x - (B.x + B.w), B.x - (A.x + A.w)), dy = Math.max(0, A.y - (B.y + B.h), B.y - (A.y + A.h));
    return dx === 0 && dy === 0;
  };

  PT.linkInfo = function (kind, a, b) {
    const r = PT.route(a, b), L = PT.LINKS[kind];
    if (kind === 'manual') {
      const walk = r.dist * 0.25 + r.df * PT.ELEV_MIN;
      return Object.assign({ ok: true, cost: 0, time: 2 + walk, worker: 2 + 2 * walk }, r);
    }
    if (kind === 'conveyor') {
      const ok = !r.df;
      return Object.assign({ ok, why: ok ? '' : '같은 층에서만 설치할 수 있습니다', cost: Math.max(2, Math.round(r.dist)) * L.perTile, time: 1 + r.dist * 0.05, worker: 0 }, r);
    }
    if (kind === 'pneumatic') return Object.assign({ ok: true, cost: L.base + Math.round(r.dist + 10 * r.df) * L.perTile, time: 3, worker: 0 }, r);
    const ok = a.floor > b.floor && PT.overlapXY(a, b);
    return Object.assign({ ok, why: ok ? '' : '아래층 설비와 위치가 겹쳐야 합니다', cost: L.cost, time: 1 + 0.5 * Math.max(0, a.floor - b.floor - 1), worker: 0 }, r);
  };

  // ── 세척·전환 (관리직·설비에 따라 줄어든다) ─────────────
  const NOMOD = { speed: 1, clean: 1, wet: 1, verify: PT.VERIFY_MIN };
  PT.mixChange = function (from, to, def, mod) {
    mod = mod || NOMOD;
    if (!from || !to || from.id === to.id) return null;
    if (from.recipe === to.recipe) return null;   // 같은 배합, 포장만 다름: 믹서 세척 불필요
    let min = R.dry * def.clean, type = 'dry';
    const parts = ['건식 청소'];
    const lost = from.allergens.filter(a => !to.allergens.includes(a));
    if (lost.length) {
      type = 'wet';
      min = (def.wetMin || R.wet * def.clean) * mod.wet + mod.verify;
      parts[0] = `습식 세척·검증(${lost.join('·')})`;
    }
    if (from.strong && !to.strong) { min += R.strong * def.clean; parts.push('진한 색 제거'); if (type === 'dry') type = 'strong'; }
    if (type !== 'wet' && from.strong && to.strong && from.recipe !== to.recipe) { min += 10 * def.clean; parts.push('색 바꾸기'); }
    return { min: min * mod.clean, type, label: parts.join(' + '), lost };
  };
  PT.packChange = function (from, to, def, mod) {
    mod = mod || NOMOD;
    if (!from || !to || from.id === to.id) return null;
    if (from.fmt === to.fmt && from.packKg === to.packKg) return { min: R.packSame * mod.clean, type: 'film', label: '필름 교체' };
    return { min: def.fmtChange * mod.clean, type: 'fmt', label: '규격 변경' };
  };

  // ── 공정 시간(분) ─────────────────────────────────
  PT.weighMin = function (m, sku, kg) {
    const d = m.def, mod = m.mod || NOMOD;
    const crew = d.crewMax > 1 ? WEIGH_CREW[Math.min(3, m.crew)] : (m.crew > 0 ? 1 : 0);
    return (3 + 2.5 * sku.nIng) * (0.7 + 0.3 * kg / 1000) / (d.speed * Math.max(crew, 0.01) * mod.speed);
  };
  PT.fetchMin = function (m, sku) {
    const crowd = m.crowd || 1;
    if (m.def.autoFeed) return 1.5 * crowd;
    const f = m.feed;
    if (!f) return 0;
    if (f.kind !== 'manual') return 1 * crowd;
    return (Math.ceil(sku.nIng / 3) * (0.5 + f.dist * 0.2) + 2 * f.df * PT.ELEV_MIN) * crowd;
  };
  PT.mixMin = (m, sku, kg) => (m.def.ibc ? PT.IBC.dock + sku.mix * m.def.mixMul
    : 6 - (m.chuteIn ? 3 : 0) - (m.chuteOut ? 2 : 0) + sku.mix * m.def.mixMul + 2 * Math.max(0, kg / 1000 - 1));
  // 지게차로 컨테이너 옮기기: 걷는 것보다 빠르고, 다른 층은 화물 엘리베이터
  PT.forkInfo = function (a, b) {
    const r = PT.route(a, b), drive = r.dist * 0.15 + r.df * PT.ELEV_MIN;
    return Object.assign({ kind: 'manual', fork: true, ok: true, cost: 0, from: a.id, to: b.id, time: 1.5 + drive, worker: 1.5 + 2 * drive }, r);
  };
  // 컨테이너 세척 시간: 알러겐·진한 색이 묻었으면 습식
  PT.washMin = (sku, mod) => {
    if (!sku) return 0;
    const wet = sku.allergens.length || sku.strong;
    return wet ? PT.IBC.wash.wet * (mod ? mod.wet : 1) + (sku.strong ? PT.IBC.wash.strong : 0) : PT.IBC.wash.dry;
  };
  PT.packRate = (m, sku) => {
    const r = m.def.rate[sku.fmt];
    return r ? r * sku.packKg * Math.min(1, m.crew / m.def.crew) * (m.mod ? m.mod.speed : 1) : 0;
  };

  // ── 배치도 → 시뮬레이션용 공장 ─────────────────────
  PT.compile = function (state) {
    const mod = PT.mods ? PT.mods(state) : NOMOD;
    const ms = state.machines.map(m => Object.assign({}, m, { def: PT.EQUIP[m.type], mod }));
    const by = st => ms.filter(m => m.def.stage === st);
    const P = {
      ms, raw: by('raw'), weigh: by('weigh'), mix: by('mix'), pack: by('pack'), fg: by('fg'), hop: by('buffer'), lift: by('lift'), office: by('office'),
      dock: by('dock'), wash: by('wash'),
      transport: state.transport, lk: {}, byId: Object.fromEntries(ms.map(m => [m.id, m])), mod,
    };
    P.byId.dock = PT.DOCK;
    // 순차(고정 믹서) 설비와 IBC(이동식 컨테이너) 설비를 나눈다
    P.cweigh = P.weigh.filter(w => !w.def.ibc); P.fill = P.weigh.filter(w => w.def.ibc);
    P.cmix = P.mix.filter(m => !m.def.ibc); P.blend = P.mix.filter(m => m.def.ibc);
    P.ibcCount = state.ibcCount || 0;
    // IBC 배출 스테이션은 포장기에 맞닿거나 바로 위층에 겹쳐 있어야 그 포장기로 내려보낼 수 있다
    P.pack.forEach(p => (p.dock = null));
    P.dock.forEach(d => {
      const p = P.pack.find(x => PT.touching(d, x) || (d.floor > x.floor && PT.overlapXY(d, x)));
      d.feeds = p ? p.id : null;
      if (p && !p.dock) p.dock = d;
    });
    P.ibcOn = P.fill.length && P.blend.length && P.wash.length && P.pack.some(p => p.dock) && P.ibcCount > 0;
    const link = (a, b) => {
      const key = a.id + '>' + b.id, set = state.links[key];
      let kind = set ? set.kind : 'manual';
      let info = PT.linkInfo(kind, a, b);
      let broken = false;
      if (!info.ok) { broken = true; kind = 'manual'; info = PT.linkInfo('manual', a, b); }
      return Object.assign({ kind, key, from: a.id, to: b.id, broken }, info);
    };
    // 서지 호퍼: 플레이어가 고른 포장기(없으면 가장 가까운 포장기) 앞에 붙는다.
    // 믹서 → 호퍼 → 포장기로 흐르고, 포장기 앞 대기 자리가 늘어난다.
    P.pack.forEach(p => { p.slots = 1; p.hop = null; });
    P.hop.forEach(h => {
      let target = h.feeds && P.byId[h.feeds] && P.byId[h.feeds].def.stage === 'pack' ? P.byId[h.feeds] : null;
      if (!target) {
        let bd = Infinity;
        P.pack.forEach(p => { const d = p.floor === h.floor ? PT.route(h, p).dist : (h.floor > p.floor && PT.overlapXY(h, p) ? 0 : Infinity); if (d < bd) { bd = d; target = p; } });
      }
      if (!target) return;
      h.feeds = target.id;
      target.slots += h.def.slots;
      if (!target.hop) {
        target.hop = h;
        // 호퍼가 포장기에 맞닿아 있거나 바로 위층에 겹쳐 있으면 중력으로 자동 투입
        h.toPack = PT.touching(h, target) || (h.floor > target.floor && PT.overlapXY(h, target))
          ? { kind: 'auto', key: h.id + '>' + target.id, from: h.id, to: target.id, ok: true, time: 1, worker: 0, cost: 0, dist: 0, df: 0 }
          : link(h, target);
      }
    });
    const nearest = (list, fn) => list.reduce((best, x) => { const l = fn(x); return !best || l.time < best.time ? l : best; }, null);
    // 원료 종류가 랙 용량을 넘으면 원료를 찾는 데 오래 걸린다
    const types = new Set();
    (state.enabled || []).forEach(id => { const k = PT.SKU[id]; if (k) Object.keys(k.bom).forEach(r => types.add(r)); });
    P.rawTypes = types.size;
    P.rawCap = P.raw.length * PT.RACK_TYPES;
    P.crowd = P.raw.length && P.rawTypes > P.rawCap ? 1.5 : 1;
    P.weigh.forEach(w => { w.feed = nearest(P.raw, r => link(r, w)); w.crowd = P.crowd; });
    P.pack.forEach(p => (p.out = nearest(P.fg, f => link(p, f))));
    P.cweigh.forEach(w => P.cmix.forEach(m => (P.lk[w.id + '>' + m.id] = link(w, m))));
    const hopParts = [];
    P.cmix.forEach(m => P.pack.forEach(p => {
      if (!p.hop) { P.lk[m.id + '>' + p.id] = link(m, p); return; }
      // 호퍼를 거치는 경로: 믹서 → 호퍼 + 호퍼 → 포장기를 한 번의 이송으로 묶는다
      const a = link(m, p.hop), b = p.hop.toPack;
      hopParts.push(a);
      P.lk[m.id + '>' + p.id] = {
        kind: a.kind === 'manual' || b.kind === 'manual' ? 'manual' : a.kind, from: m.id, to: p.id, via: p.hop.id, parts: [a, b],
        time: a.time + b.time, worker: (a.worker || 0) + (b.worker || 0), outKind: a.kind, ok: true,
      };
    }));
    P.hop.forEach(h => { if (h.toPack) hopParts.push(h.toPack); });
    // 계량대가 여러 대면 믹서 하나에 다음 배치를 그 수만큼(최대 3) 미리 준비해 둘 수 있다
    P.cmix.forEach(m => {
      m.inCap = Math.min(3, Math.max(1, P.cweigh.length));
      m.chuteIn = P.cweigh.some(w => P.lk[w.id + '>' + m.id].kind === 'chute');
      m.chuteOut = P.pack.some(p => (P.lk[m.id + '>' + p.id].outKind || P.lk[m.id + '>' + p.id].kind) === 'chute');
    });
    P.blend.forEach(m => (m.inCap = Math.min(3, Math.max(1, P.fill.length))));
    // 지게차 경로: 세척기 → 충전 → 블렌더 → 배출 스테이션 → 세척기
    P.fk = {};
    if (P.ibcOn) {
      const fk = (a, b) => (P.fk[a.id + '>' + b.id] = PT.forkInfo(a, b)), w0 = P.wash[0];
      P.fill.forEach(f => { fk(w0, f); P.blend.forEach(b => fk(f, b)); });
      P.pack.forEach(p => { if (!p.dock) return; P.blend.forEach(b => fk(b, p.dock)); fk(p.dock, w0); });
    }
    P.forks = Object.values(P.fk);
    // 위층 원료 랙은 리프트가 없으면 운반 작업자가 입고장에서 끌어올린다
    P.weigh.forEach(w => {
      const rack = w.feed && P.byId[w.feed.from];
      w.lift = rack && rack.floor > 1 && !P.lift.length ? Object.assign({ kind: 'manual', from: 'dock', to: rack.id }, PT.linkInfo('manual', PT.DOCK, rack)) : null;
    });
    // 그리기용 경로 목록: 호퍼를 거치는 묶음 경로 대신 실제 구간을 넣는다
    P.links = Object.values(P.lk).filter(l => !l.via).concat(hopParts, P.weigh.map(w => w.feed), P.pack.map(p => p.out)).filter(Boolean);
    return P;
  };

  PT.validate = function (state, P) {
    const out = [];
    const need = (list, msg) => { if (!list.length) out.push(msg); };
    need(P.raw, '원료 랙이 없습니다');
    need(P.weigh, '계량 설비가 없습니다');
    need(P.mix, '믹서가 없습니다');
    need(P.pack, '포장기가 없습니다');
    need(P.fg, '제품 랙이 없습니다');
    const fmts = [...new Set((state.enabled || []).map(id => PT.SKU[id].fmt))];
    fmts.forEach(f => {
      if (P.pack.length && !P.pack.some(p => p.def.fmts.includes(f))) out.push(f === 'bulk' ? '영업 중인 지대 품목을 담을 포장기가 없습니다' : '영업 중인 파우치 품목을 담을 포장기가 없습니다');
    });
    if (!(state.enabled || []).length) out.push('영업 중인 품목이 없습니다');
    P.ms.forEach(m => { if (m.def.crew > 0 && !m.crew) out.push(`${m.def.name}에 작업자가 없습니다`); });
    const usesManual = P.links.some(l => l.kind === 'manual' && P.byId[l.from] && P.byId[l.from].def && P.byId[l.from].def.stage !== 'raw')
      || P.weigh.some(w => w.lift);
    if (usesManual && !state.transport) out.push('수동 운반이 필요한데 운반 작업자가 없습니다');
    // IBC 라인: 하나라도 놓았으면 나머지도 갖춰야 돈다
    if (P.fill.length || P.blend.length || P.dock.length || P.wash.length) {
      if (!P.fill.length) out.push('IBC 라인에 충전 스테이션이 없습니다');
      if (!P.blend.length) out.push('IBC 라인에 블렌더가 없습니다');
      if (!P.wash.length) out.push('IBC 라인에 컨테이너 세척기가 없습니다');
      if (!P.dock.length) out.push('IBC 라인에 배출 스테이션이 없습니다');
      else if (!P.pack.some(p => p.dock)) out.push('IBC 배출 스테이션을 포장기에 맞닿게(또는 바로 위층에) 두세요');
      if (!P.ibcCount) out.push('IBC 컨테이너가 없습니다 (건설 탭에서 구입)');
      if (!state.transport) out.push('IBC 컨테이너를 옮길 지게차 기사(운반 작업자)가 없습니다');
    }
    if (P.cweigh.length && !P.cmix.length) out.push('일반 계량대가 보낼 고정 믹서가 없습니다 (IBC 블렌더는 충전 스테이션에서만 받습니다)');
    if (P.cmix.length && !P.cweigh.length) out.push('고정 믹서에 원료를 보낼 일반 계량대가 없습니다');
    return out;
  };

  // ── 시뮬레이션 ────────────────────────────────────
  // plan: [{sku, kg}], opts: { dayMin, start:{machineId: skuId}, record, down:[{id:'all'|machineId, from, to, label}] }
  PT.simulate = function (P, plan, opts) {
    const dt = 0.25, dayEnd = opts.dayMin, rec = !!opts.record, start = opts.start || {}, mod = P.mod || NOMOD;
    const down = opts.down || [];
    const queue = plan.filter(r => r.kg > 0 && PT.SKU[r.sku]).map(r => ({ sku: r.sku, kg: r.kg }));
    const planned = {};
    queue.forEach(r => (planned[r.sku] = (planned[r.sku] || 0) + r.kg));
    let t = 0, nextId = 0, wetCount = 0;
    const produced = {}, intervals = {}, transfers = [], stat = {}, changeBySku = {}, wetBySku = {}, cleanBySku = {};
    let cleanCost = 0;
    const charge = (type, sku) => { const c = PT.CLEAN_COST[type] || 0; cleanCost += c; cleanBySku[sku] = (cleanBySku[sku] || 0) + c; };
    const mk = (m, kind) => ({ m, kind, st: 'idle', sku: null, rem: 0, last: PT.SKU[start[m.id]] || null, ist: null, down: false });
    const ibcOn = !!P.ibcOn;
    const W = P.weigh.filter(m => !m.def.ibc || ibcOn).map(m => Object.assign(mk(m, 'W'), { batch: null, waitLift: false, waitCont: false, ibc: !!m.def.ibc }));
    const M = P.mix.filter(m => !m.def.ibc || ibcOn).map(m => Object.assign(mk(m, 'M'), { cur: null, incq: [], asked: false, ctype: null, ibc: !!m.def.ibc }));   // incq: 계량을 마쳤거나 계량 중인 다음 배치들
    const K = P.pack.map(m => Object.assign(mk(m, 'P'), { cur: null, buf: [], reserved: 0, out: null, dockBusy: false }));
    const X = ibcOn ? P.wash.map(m => mk(m, 'X')) : [];   // 컨테이너 세척기
    const ibcLine = M.some(x => x.ibc);
    const all = W.concat(M, K, X);
    const rtById = Object.fromEntries(all.map(r => [r.m.id, r]));
    all.forEach(r => { stat[r.m.id] = { run: 0, change: 0, hold: 0, wait: 0, idle: 0, nocrew: 0, down: 0 }; if (rec) intervals[r.m.id] = []; });
    const workers = Array.from({ length: P.transport }, (_, i) => ({ id: i, until: 0, busy: 0 }));
    const pending = [], moving = [];
    const CAT = { work: 'run', mix: 'run', pack: 'run', wash: 'run', clean: 'change', wet: 'change', change: 'change', hold: 'hold', wait: 'wait', lift: 'wait', cwait: 'wait', idle: 'idle', nocrew: 'nocrew', down: 'down' };
    // IBC 컨테이너: 깨끗한 것은 세척기 옆에서 대기(pool), 다 섞은 것은 블렌더 옆에 내려놓음(staged), 쓴 것은 세척 대기(washQ)
    let pool = ibcOn ? P.ibcCount : 0, contShort = 0, ibcWet = 0;
    const staged = [], washQ = [], ibcSnap = [];
    const washer0 = P.wash[0];
    const noCrew = r => r.m.def.crew > 0 && !r.m.crew;
    const isDown = r => down.some(d => (d.id === 'all' || d.id === r.m.id) && t >= d.from && t < d.to);

    function setSt(r, st, sku) { r.st = st; r.sku = sku || null; }
    // toKind: L 원료 올리기 · M 믹서로 · P 포장기로 · F 제품 랙으로 · C 빈 컨테이너를 충전대로 · D 컨테이너를 배출 스테이션으로 · X 쓴 컨테이너를 세척기로
    function request(batch, from, toId, lk, toKind, extra) {
      const req = Object.assign({ batch, from, toId, lk, toKind }, extra);
      if (lk.kind === 'manual') pending.push(req); else startMove(req, null);
    }
    function startMove(req, w) {
      const f = req.from;
      if (req.toKind !== 'L') {
        if (f.kind === 'W') { f.batch = null; setSt(f, 'idle'); }
        else if (f.kind === 'M') { f.last = f.cur.sku; f.cur = null; f.asked = false; setSt(f, 'idle'); }
        else if (f.kind === 'P') { f.out = null; }
      }
      // 빈 컨테이너를 들어 올려야 배출 스테이션이 비워진다
      if (req.freeDock) { req.freeDock.dockBusy = false; req.freeDock.dockSku = null; }
      const mv = { req, s: t, e: t + req.lk.time };
      if (w) { w.until = t + req.lk.worker; w.busy += Math.max(0, Math.min(dayEnd, w.until) - t); mv.w = w.id; mv.we = w.until; }
      moving.push(mv);
      if (rec) transfers.push({ s: mv.s, e: mv.e, we: w ? mv.we : mv.e, w: w ? w.id : -1, from: req.toKind === 'L' ? 'dock' : f.m.id, to: req.drawTo || req.toId, kind: req.lk.kind, sku: req.batch.sku.id, lift: req.toKind === 'L',
        via: req.lk.via, kinds: req.lk.parts ? req.lk.parts.map(p => p.kind) : null, fork: !!req.lk.fork, empty: req.toKind === 'C', dirty: req.toKind === 'X' });
    }
    function deliver(mv) {
      const { batch, toId, toKind, from } = mv.req;
      if (toKind === 'L') from.lifted = true;
      else if (toKind === 'M') batch.arrived = true;
      else if (toKind === 'P' || toKind === 'D') {
        const p = rtById[toId];
        if (toKind === 'D') { batch.viaDock = true; p.dockSku = batch.sku.id; }
        p.buf.push(batch); p.reserved--;
      }
      else if (toKind === 'C') rtById[toId].contHere = true;
      else if (toKind === 'X') washQ.push(batch.sku);
      else if (mv.e <= dayEnd + 1e-9) produced[batch.sku.id] = (produced[batch.sku.id] || 0) + batch.kg;
    }
    // IBC 충전 스테이션은 IBC 블렌더로, 일반 계량대는 고정 믹서로만 보낸다. 고른 믹서의 세척(pickCh)도 함께 남긴다
    function pickMixer(sku, w) {
      let best = null, bs = Infinity, bestCh = null;
      M.forEach(x => {
        if (x.ibc !== w.ibc || x.incq.length >= x.m.inCap || noCrew(x)) return;
        const after = x.incq.length ? x.incq[x.incq.length - 1].sku : x.cur ? x.cur.sku : x.last;
        const ch = x.ibc ? null : PT.mixChange(after, sku, x.m.def, mod);
        const busy = (x.cur ? (x.st === 'mix' ? x.rem : 0) + 2 : 0) + x.incq.length * PT.mixMin(x.m, sku, x.m.def.cap);
        // 가까운 믹서부터: 이송 시간(수동이면 운반원이 묶이는 시간까지)을 더한다
        const lk = P[w.ibc ? 'fk' : 'lk'][w.m.id + '>' + x.m.id];
        const score = busy + (ch ? ch.min : 0) + (lk ? lk.time + (lk.kind === 'manual' ? lk.worker : 0) : 0);
        if (score < bs) { bs = score; best = x; bestCh = ch; }
      });
      if (best) best.pickCh = bestCh;
      return best;
    }
    function pickPacker(sku) {
      let best = null, bs = Infinity;
      K.forEach(p => {
        if (noCrew(p) || !p.m.def.fmts.includes(sku.fmt)) return;
        if (p.buf.length + p.reserved + (p.cur ? 1 : 0) >= p.m.slots + 1) return;
        const lastSku = p.buf.length ? p.buf[p.buf.length - 1].sku : (p.cur ? p.cur.sku : p.last);
        const ch = PT.packChange(lastSku, sku, p.m.def, mod);
        const score = (p.buf.length + p.reserved) * 30 + (p.cur ? p.rem : 0) + (ch ? ch.min : 0);
        if (score < bs) { bs = score; best = p; }
      });
      return best;
    }
    function finishPack(p) {
      if (p.cur.viaDock) {
        // 다 비운 컨테이너는 지게차가 세척기로 가져간다
        const d = p.m.dock;
        request(p.cur, { kind: 'D', m: d }, washer0.id, P.fk[d.id + '>' + washer0.id], 'X', { freeDock: p });
      }
      p.out = p.cur; p.last = p.cur.sku; p.cur = null; setSt(p, 'idle');
      request(p.out, p, p.m.out.to, p.m.out, 'F');
    }
    function startWeigh(w) {
      const sku = w.batch.sku;
      w.rem = PT.fetchMin(w.m, sku) + (w.last && w.last.id !== sku.id ? R.recipe : 0) + PT.weighMin(w.m, sku, w.batch.kg);
      w.last = sku;
      setSt(w, 'work', sku.id);
    }

    while (t < dayEnd - 1e-9) {
      for (let i = moving.length - 1; i >= 0; i--) if (moving[i].e <= t + 1e-9) { deliver(moving[i]); moving.splice(i, 1); }
      while (pending.length) {
        const w = workers.find(x => x.until <= t + 1e-9);
        if (!w) break;
        startMove(pending.shift(), w);
      }
      all.forEach(r => (r.down = isDown(r)));
      // 계량
      for (const w of W) {
        if (w.down) continue;
        if (w.st === 'cwait' && w.batch) {
          // IBC: 빈 컨테이너(와 위층이면 원료)가 도착해야 담기 시작
          if (w.contHere && (!w.m.lift || w.lifted)) startWeigh(w); else continue;
        }
        if (w.st === 'idle' || w.st === 'wait' || w.st === 'nocrew' || w.st === 'cwait') {
          if (noCrew(w)) { setSt(w, 'nocrew'); continue; }
          if (!queue.length) { setSt(w, 'idle'); continue; }
          // IBC 라인이 함께 있으면 순차 믹서는 습식·색 세척이 드는 품목을 IBC에 넘기고, 앞쪽 몇 개 중 세척이 짧은 품목을 먼저 받는다
          let ri = 0, target = null;
          const look = !w.ibc && ibcLine ? Math.min(4, queue.length) : 1;
          for (let i = 0; i < look; i++) {
            const tg = pickMixer(PT.SKU[queue[i].sku], w);
            if (!tg) break;
            if (!i) target = tg;
            if (!tg.pickCh || tg.pickCh.type === 'dry') { ri = i; target = tg; break; }
          }
          if (!target) { setSt(w, 'wait'); continue; }
          const run = queue[ri], sku = PT.SKU[run.sku];
          if (w.ibc && pool <= 0) { setSt(w, 'cwait'); continue; }   // 깨끗한 컨테이너가 없음
          const cap = target.m.def.cap;
          const kg = Math.max(cap * R.minFill, run.kg / Math.ceil(run.kg / cap - 1e-9));
          run.kg -= kg;
          if (run.kg <= 1e-6) queue.splice(ri, 1);
          const batch = { id: nextId++, sku, kg, mixer: target.m.id };
          batch.arrived = false; target.incq.push(batch);
          w.batch = batch;
          if (w.ibc) {
            pool--; w.contHere = false; w.lifted = false;
            request(batch, { kind: 'C', m: washer0 }, w.m.id, P.fk[washer0.id + '>' + w.m.id], 'C');
            if (w.m.lift) request(batch, w, w.m.lift.to, w.m.lift, 'L');
            setSt(w, 'cwait', sku.id);
            continue;
          }
          if (w.m.lift) {
            w.lifted = false;
            setSt(w, 'lift', sku.id);
            request(batch, w, w.m.lift.to, w.m.lift, 'L');
            continue;
          }
          startWeigh(w);
        }
        if (w.st === 'lift') { if (w.lifted) startWeigh(w); else continue; }
        if (w.st === 'work') {
          w.rem -= dt;
          if (w.rem <= 0) { setSt(w, 'hold', w.batch.sku.id); request(w.batch, w, w.batch.mixer, P[w.ibc ? 'fk' : 'lk'][w.m.id + '>' + w.batch.mixer], 'M'); }
        }
      }
      // 믹서
      for (const x of M) {
        if (x.down) continue;
        if (noCrew(x)) { setSt(x, 'nocrew'); continue; }
        if (x.st === 'mix') {
          x.rem -= dt;
          if (x.rem > 0) continue;
          if (x.ibc) {
            // 섞은 컨테이너는 블렌더 옆에 내려놓고 바로 다음 컨테이너를 받는다 (블렌더는 세척이 없다)
            staged.push({ batch: x.cur, from: x });
            x.last = x.cur.sku; x.cur = null; setSt(x, 'idle');
          } else setSt(x, 'hold', x.cur.sku.id);
        }
        if (x.st === 'hold') {
          if (!x.asked) {
            const p = pickPacker(x.cur.sku);
            if (p) { p.reserved++; x.asked = true; request(x.cur, x, p.m.id, P.lk[x.m.id + '>' + p.m.id], 'P'); }
          }
          continue;
        }
        if (x.st === 'clean' || x.st === 'wet') {
          x.rem -= dt;
          if (x.rem > 0) continue;
          x.last = null;
        }
        const nx = x.incq[0];
        if (!x.cur && nx) {
          const ch = x.ibc ? null : PT.mixChange(x.last, nx.sku, x.m.def, mod);
          if (ch) {
            // 알러겐·진한 색 때문에 생긴 세척은 그 성분을 남긴 앞 품목 몫, 단순 건식 청소는 들어올 품목 몫
            const who = (ch.type === 'wet' || ch.type === 'strong') && x.last ? x.last.id : nx.sku.id;
            x.rem = ch.min;
            if (ch.type === 'wet') { wetCount++; wetBySku[who] = (wetBySku[who] || 0) + ch.min; }
            changeBySku[who] = (changeBySku[who] || 0) + ch.min;
            charge(ch.type, who);
            setSt(x, ch.type === 'wet' ? 'wet' : 'clean', nx.sku.id);
            continue;
          }
          if (nx.arrived) {
            x.cur = x.incq.shift();
            x.rem = PT.mixMin(x.m, x.cur.sku, x.cur.kg) - dt;
            setSt(x, 'mix', x.cur.sku.id);
          } else setSt(x, 'wait', nx.sku.id);
        } else if (!x.cur) setSt(x, 'idle');
      }
      // IBC: 배출 스테이션이 비면 섞어 둔 컨테이너를 지게차로 올린다 (같은 품목이면 먼저 → 포장기 전환을 줄임)
      if (ibcOn && staged.length) for (const p of K) {
        if (!p.m.dock || p.dockBusy || p.down || noCrew(p)) continue;
        const lastSku = p.buf.length ? p.buf[p.buf.length - 1].sku : (p.cur ? p.cur.sku : p.last);
        let i = lastSku ? staged.findIndex(s => s.batch.sku.id === lastSku.id) : -1;
        if (i < 0) i = staged.findIndex(s => p.m.def.fmts.includes(s.batch.sku.fmt));
        if (i < 0) continue;
        const s = staged.splice(i, 1)[0], d = p.m.dock;
        p.dockBusy = true; p.reserved++;
        request(s.batch, { kind: 'S', m: s.from.m }, p.m.id, P.fk[s.from.m.id + '>' + d.id], 'D', { drawTo: d.id });
        if (!staged.length) break;
      }
      // 포장기
      for (const p of K) {
        if (p.down) continue;
        if (noCrew(p)) { setSt(p, 'nocrew'); continue; }
        if (p.st === 'change') {
          p.rem -= dt;
          changeBySku[p.sku] = (changeBySku[p.sku] || 0) + dt;
          if (p.rem > 0) continue;
          p.last = p.cur.sku;
          p.rem = p.cur.kg / PT.packRate(p.m, p.cur.sku);
          setSt(p, 'pack', p.cur.sku.id);
          continue;
        }
        if (p.st === 'pack') {
          p.rem -= dt;
          if (p.rem > 0) continue;
          if (p.out) { setSt(p, 'hold', p.cur.sku.id); continue; }
          finishPack(p);
        }
        if (p.st === 'hold') {
          if (p.out) continue;
          finishPack(p);
        }
        if (!p.cur) {
          if (p.buf.length) {
            p.cur = p.buf.shift();
            const ch = PT.packChange(p.last, p.cur.sku, p.m.def, mod);
            if (ch) { p.rem = ch.min; charge(ch.type, p.cur.sku.id); setSt(p, 'change', p.cur.sku.id); }
            else { p.rem = p.cur.kg / PT.packRate(p.m, p.cur.sku) - dt; setSt(p, 'pack', p.cur.sku.id); }
          } else setSt(p, p.reserved ? 'wait' : 'idle');
        }
      }
      // IBC 컨테이너 세척기: 라인 밖에서 씻으니 믹서·포장기는 멈추지 않는다
      for (const x of X) {
        if (x.down) continue;
        if (noCrew(x)) { setSt(x, 'nocrew'); continue; }
        if (x.st === 'wash') {
          x.rem -= dt;
          if (x.rem > 0) continue;
          pool++; setSt(x, 'idle');
        }
        if (!washQ.length) continue;
        const k = washQ.shift(), wet = !!(k.allergens.length || k.strong);
        const c = PT.IBC.washCost[wet ? 'wet' : 'dry'];
        cleanCost += c; cleanBySku[k.id] = (cleanBySku[k.id] || 0) + c;
        if (wet) ibcWet++;   // 라인 밖 세척이라 믹서 습식 세척 횟수와 따로 센다
        x.rem = PT.washMin(k, mod) * mod.clean;
        setSt(x, 'wash', k.id);
      }
      if (ibcOn) {
        if (W.some(w => w.ibc && w.st === 'cwait' && !w.batch)) contShort += dt;
        if (rec) {
          const docks = {};
          K.forEach(p => { if (p.m.dock && p.dockSku) docks[p.m.dock.id] = p.dockSku; });
          const snap = { s: t, pool, staged: staged.map(s => s.batch.sku.id), dirty: washQ.map(k => k.id), docks };
          snap.key = [pool, snap.staged.join(','), snap.dirty.join(','), JSON.stringify(docks)].join('|');
          if (!ibcSnap.length || ibcSnap[ibcSnap.length - 1].key !== snap.key) ibcSnap.push(snap);
        }
      }
      // 집계·기록
      for (const r of all) {
        const shown = r.down ? 'down' : r.st;
        stat[r.m.id][r.kind === 'W' && shown === 'wait' ? 'hold' : CAT[shown]] += dt;
        if (rec) {
          const q = r.kind === 'P' ? r.buf.length : r.kind === 'X' ? washQ.length : 0;
          const key = shown + '|' + (r.sku || '') + '|' + q;
          if (!r.ist || r.ist.key !== key) {
            if (r.ist) r.ist.e = t;
            r.ist = { s: t, e: dayEnd, st: shown, sku: r.sku, q, key, rem: r.rem };
            intervals[r.m.id].push(r.ist);
          }
        }
      }
      t += dt;
    }

    const total = Object.values(produced).reduce((a, b) => a + b, 0);
    const leftover = Object.keys(planned).map(id => ({ sku: id, kg: Math.max(0, planned[id] - (produced[id] || 0)) })).filter(r => r.kg > 1);
    const moveBusy = workers.reduce((a, w) => a + w.busy, 0);
    const endLast = {};
    all.forEach(r => { const k = r.cur ? r.cur.sku : r.last; endLast[r.m.id] = k ? k.id : null; });
    return { produced, total, stat, intervals, transfers, leftover, dayEnd, moveBusy, workers: workers.length, endLast, changeBySku, wetBySku, wetMin: Object.values(wetBySku).reduce((a, b) => a + b, 0), wetCount, cleanCost, cleanBySku,
      ibc: ibcOn ? { snap: ibcSnap, short: contShort, count: P.ibcCount, wet: ibcWet } : null };
  };

  // ── 능력 분석: 영업 중인 품목을 보통 주문 크기로 하루 꽉 채워 돌린다 ──
  PT.testPlan = function (state) {
    const ids = (state.enabled && state.enabled.length ? state.enabled : ['BU-b20', 'TW-b20']).filter(id => PT.SKU[id]);
    const plan = [];
    for (let i = 0; i < 8; i++) ids.forEach(id => {
      const pk = PT.PACKS[PT.SKU[id].pack];
      plan.push({ sku: id, kg: Math.round((pk.lot[0] + pk.lot[1]) / 2 / 500) * 500 });
    });
    return plan;
  };

  // 설비 묶음의 평균 가동률(가동 + 세척·전환). 시뮬레이션에 안 들어간 설비(미완성 IBC 등)는 뺀다
  PT.busyOf = function (res, list) {
    const ms = list.filter(m => res.stat[m.id]);
    return ms.length ? ms.reduce((a, m) => a + (res.stat[m.id].run + res.stat[m.id].change) / res.dayEnd, 0) / ms.length : 0;
  };

  PT.analyze = function (state, P) {
    P = P || PT.compile(state);
    const issues = PT.validate(state, P);
    if (issues.length) return { ok: false, issues, P };
    const res = PT.simulate(P, PT.testPlan(state), { dayMin: PT.SHIFT_MIN, start: {} });
    const busyOf = PT.busyOf.bind(null, res);
    const stages = [
      { key: 'weigh', n: P.weigh.length, busy: busyOf(P.weigh) },
      { key: 'mix', n: P.mix.length, busy: busyOf(P.mix) },
      { key: 'pack', n: P.pack.length, busy: busyOf(P.pack) },
      { key: 'move', n: state.transport, busy: state.transport ? res.moveBusy / (state.transport * PT.SHIFT_MIN) : 0 },
    ];
    if (res.ibc) {
      stages.push({ key: 'wash', n: P.wash.length, busy: busyOf(P.wash) });
      // 컨테이너는 "가동률" 대신 충전대가 빈 컨테이너를 기다린 시간 비율
      stages.push({ key: 'cont', n: P.ibcCount, busy: res.ibc.short / PT.SHIFT_MIN });
    }
    stages.forEach(s => (s.cap = s.key !== 'cont' && s.busy > 0.02 ? res.total / Math.min(1, s.busy) : Infinity));
    const bn = stages.filter(s => s.n > 0).reduce((a, s) => (s.busy > a.busy ? s : a), stages[0]);
    const change = P.mix.concat(P.pack).reduce((a, m) => a + (res.stat[m.id] ? res.stat[m.id].change : 0), 0);
    return { ok: true, issues: [], P, res, total: res.total, stages, bottleneck: bn.key, change };
  };
})();
</script>
<script>
/* 프리믹스 타이쿤 — 게임 상태: 시나리오, 건설, 영업, 관리직, 아침 소식, 하루 정산, 등급 */
'use strict';
(function () {
  const G = PT.game = {};
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // 시드 고정 난수: 같은 시나리오면 모두 같은 주문·소식을 받는다
  PT.rng = function (seed, day, stream) {
    let h = (2166136261 ^ seed) >>> 0;
    const key = day + '|' + stream;
    for (let i = 0; i < key.length; i++) { h ^= key.charCodeAt(i); h = Math.imul(h, 16777619); }
    let a = h >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  const pick = (rng, list) => list[Math.floor(rng() * list.length)];

  function won(n) {
    const a = Math.abs(n), sign = n < 0 && a >= 5000 ? '−' : '';
    if (a >= 1e8) return sign + (Math.round(a / 1e6) / 100) + '억원';
    return sign + Math.round(a / 1e4).toLocaleString('ko-KR') + '만원';
  }
  G.won = won;
  function log(s, text, tone) { s.log.unshift({ day: s.day, text, tone: tone || 'info' }); if (s.log.length > 200) s.log.length = 200; }
  G.log = log;

  // ── 새 게임 ─────────────────────────────────────
  G.scen = s => (s.scen === 'free' ? Object.assign({}, PT.FREE, { seed: s.seed, capital: s.capital }) : PT.SCENARIOS.find(x => x.id === s.scen));
  G.newGame = function (scenId, nick, opts) {
    opts = opts || {};
    const sc = scenId === 'free' ? Object.assign({}, PT.FREE, { seed: opts.seed || 2611, capital: opts.capital || PT.FREE.capital }) : PT.SCENARIOS.find(x => x.id === scenId);
    const s = {
      v: 3, scen: sc.id, seed: sc.seed, capital: sc.capital, nick: (nick || '').slice(0, 12),
      phase: 'build', day: 0, over: null,
      cash: sc.capital - PT.BASE_WORKS, invested: PT.BASE_WORKS, profitCum: 0, dayExtra: 0,
      machines: [], links: {}, transport: 1, nextId: 1, ibcCount: 0, ibcPaid: 0,
      enabled: sc.enabled.slice(), registered: [],
      orders: [], plan: [], planRule: 'group', overtime: 0, fg: {}, lastSku: {},
      managers: [], candidates: [], candSeq: 0, effects: [], contract: null, morning: [], strikeToday: false, todayDown: [],
      skuStats: {}, history: [], log: [], badges: [],
      totals: { onTime: 0, late: 0, canceled: 0, producedKg: 0, revenue: 0, change: 0, accidents: 0, breakdowns: 0, dryDays: 0, quits: 0, contractOk: 0 },
      tut: sc.tutorial ? { step: 0, trial: false, tweak: false } : null,
    };
    G.refreshCandidates(s, true);
    log(s, `「${sc.name}」 시나리오를 시작합니다. 기본 공사비 ${won(PT.BASE_WORKS)}이 들어갔습니다.`, 'good');
    if (sc.prebuilt) G.prebuild(s);
    return s;
  };

  // ── 조회 ────────────────────────────────────────
  G.byId = (s, id) => s.machines.find(m => m.id === id);
  G.crewTotal = s => s.machines.reduce((a, m) => a + (m.crew || 0), 0);
  G.headcount = s => PT.FIXED_CREW + G.crewTotal(s) + s.transport;
  G.equipValue = s => s.machines.reduce((a, m) => a + m.paid, 0) + (s.ibcPaid || 0);
  G.usedFloors = s => new Set(s.machines.map(m => m.floor)).size + (s.machines.some(m => m.floor === 1) ? 0 : 1);
  G.mgrPay = s => s.managers.reduce((a, m) => a + m.salary, 0);
  G.seats = s => s.machines.filter(m => m.type === 'office').length * PT.EQUIP.office.seats;
  G.skuFee = s => s.enabled.length * PT.SKU_FEE * PT.mods(s).skuFee;
  // 고정비 = 인건비 + 관리직 + 관리비 + 사용 층 + 정비 + 품목 관리비
  G.fixedParts = s => ({
    wages: G.headcount(s) * PT.WAGE, mgr: G.mgrPay(s), overhead: PT.OVERHEAD + Math.max(0, G.usedFloors(s) - 1) * PT.FLOOR_OVERHEAD,
    maint: G.equipValue(s) * PT.MAINT_RATE, sku: G.skuFee(s),
  });
  G.fixedPerDay = s => Object.values(G.fixedParts(s)).reduce((a, b) => a + b, 0);
  G.otCost = s => G.headcount(s) * PT.WAGE / PT.SHIFT_MIN * 1.5 * s.overtime;
  G.dayMin = s => PT.SHIFT_MIN + s.overtime;
  G.refundRate = s => (s.phase === 'build' ? 1 : PT.REFUND_OPEN);
  G.recentProfit = s => { const h = s.history.slice(-5); return h.length ? h.reduce((a, d) => a + d.opProfit, 0) / h.length : 0; };
  G.payback = s => { const p = G.recentProfit(s); return p > 0 ? s.invested / (p * 22) : Infinity; };
  G.otif = s => { const t = s.totals, n = t.onTime + t.late + t.canceled; return n ? t.onTime / n : 0; };
  G.effect = (s, kind) => s.effects.find(e => e.kind === kind && s.day <= e.until);
  G.skuList = s => Object.values(PT.SKU).filter(k => !k.custom || s.registered.includes(k.id));

  // ── 관리직 효과 → 시뮬레이션 보정값 ───────────────────
  G.power = function (s, role) {
    return Math.min(4, s.managers.reduce((a, m) => {
      const tr = PT.TRAITS[m.trait];
      const onboard = s.phase === 'run' && s.day - m.hired < 2 ? 0.5 : 1;
      const grow = m.trait === 'rookie' ? Math.min(1.5, 1 + 0.04 * Math.max(0, s.day - m.hired)) : 1;
      const e = m.level * tr.eff * onboard * grow;
      return a + (m.role === role ? e : m.role === 'all' ? e / 2 : 0);
    }, 0));
  };
  PT.mods = function (s) {
    const pw = r => G.power(s, r);
    const mood = s.managers.filter(m => m.trait === 'mood').length;
    const heat = G.effect(s, 'heat') ? 0.93 : 1;
    return {
      speed: (1 + 0.05 * pw('leader') + 0.03 * mood) * heat,
      clean: 1 / (1 + 0.1 * pw('engineer')),
      wet: 1 / (1 + 0.08 * pw('food')),
      verify: Math.max(5, PT.VERIFY_MIN - 4 * pw('food')),
      skuFee: 1 / (1 + 0.15 * pw('food')),
      price: 1 + 0.02 * pw('sales'),
      regFee: 1 / (1 + 0.35 * pw('sales')),
      accident: 1 / (1 + 0.4 * pw('leader')),
      breakdown: 1 / (1 + 0.5 * pw('engineer')),
      audit: Math.min(0.95, 0.55 + 0.12 * pw('food')),
      analyst: pw('analyst'),
    };
  };

  // ── 건설 ────────────────────────────────────────
  G.canPlace = function (s, type, floor, x, y, rot, ignoreId) {
    const d = PT.EQUIP[type], w = rot ? d.h : d.w, h = rot ? d.w : d.h;
    if (floor < 1 || floor > PT.FLOORS) return { ok: false, why: '건물 밖입니다' };
    if (d.floor && d.floor !== floor) return { ok: false, why: `${d.name}는 ${d.floor}층에만 둡니다` };
    if (x < 0 || y < 0 || x + w > PT.GRID.w || y + h > PT.GRID.h) return { ok: false, why: '건물 밖입니다' };
    const E = PT.ELEVATOR;
    if (x < E.x + E.w && E.x < x + w && y < E.y + E.h && E.y < y + h) return { ok: false, why: '엘리베이터 자리입니다' };
    for (const m of s.machines) {
      if (m.id === ignoreId || m.floor !== floor) continue;
      const f = PT.fp(m);
      if (x < f.x + f.w && f.x < x + w && y < f.y + f.h && f.y < y + h) return { ok: false, why: `${PT.EQUIP[m.type].name}와 겹칩니다` };
    }
    return { ok: true };
  };
  G.place = function (s, type, floor, x, y, rot) {
    const d = PT.EQUIP[type];
    if (!G.canPlace(s, type, floor, x, y, rot).ok || s.cash < d.cost) return null;
    const m = { id: 'm' + s.nextId++, type, floor, x, y, rot: !!rot, crew: d.crew, paid: d.cost };
    if (type === 'hopper') {
      // 처음엔 가장 가까운 포장기에 붙인다 (설비 탭에서 바꿀 수 있음)
      let best = null, bd = Infinity;
      s.machines.filter(p => PT.EQUIP[p.type].stage === 'pack').forEach(p => { const d = PT.route(m, p).dist + Math.abs(p.floor - floor) * 4; if (d < bd) { bd = d; best = p; } });
      if (best) m.feeds = best.id;
    }
    s.machines.push(m);
    s.cash -= d.cost; s.invested += d.cost;
    log(s, `${d.name}를 ${floor}층에 설치했습니다 (${won(d.cost)}).`);
    return m;
  };
  G.move = function (s, id, floor, x, y, rot) {
    const m = G.byId(s, id);
    if (!m || !G.canPlace(s, m.type, floor, x, y, rot, id).ok) return false;
    if (s.phase !== 'build') {
      if (s.cash < PT.MOVE_COST) return false;
      s.cash -= PT.MOVE_COST; s.dayExtra += PT.MOVE_COST;
    }
    Object.assign(m, { floor, x, y, rot: !!rot });
    return true;
  };
  G.sell = function (s, id) {
    const m = G.byId(s, id);
    if (!m) return 0;
    if (m.type === 'office' && s.managers.length > G.seats(s) - PT.EQUIP.office.seats) return -1;
    // 원래 있던 라인(시나리오 6)은 중고로 팔려 60%만 돌아오고, 투자액에서는 장부가 전부가 빠진다
    const rateOf = x => (x.legacy ? PT.REFUND_OPEN : G.refundRate(s));
    let refund = m.paid * rateOf(m), book = m.legacy ? m.paid : refund;
    Object.keys(s.links).forEach(k => {
      const [a, b] = k.split('>');
      if (a === id || b === id) { const l = s.links[k], r = l.paid * rateOf(l); refund += r; book += l.legacy ? l.paid : r; delete s.links[k]; }
    });
    s.machines = s.machines.filter(x => x !== m);
    s.cash += refund; s.invested -= book;
    delete s.lastSku[id];
    log(s, `${PT.EQUIP[m.type].name}를 매각했습니다 (${won(refund)} 회수).`);
    return refund;
  };
  G.setLink = function (s, fromId, toId, kind) {
    const a = G.byId(s, fromId), b = G.byId(s, toId);
    if (!a || !b) return false;
    const key = fromId + '>' + toId, old = s.links[key];
    const info = PT.linkInfo(kind, a, b);
    if (!info.ok) return false;
    const refund = old ? old.paid * (old.legacy ? PT.REFUND_OPEN : G.refundRate(s)) : 0;
    const cost = kind === 'manual' ? 0 : info.cost;
    if (s.cash + refund < cost) return false;
    if (old) { s.cash += refund; s.invested -= old.legacy ? old.paid : refund; delete s.links[key]; }
    if (kind !== 'manual') { s.links[key] = { kind, paid: cost }; s.cash -= cost; s.invested += cost; }
    return true;
  };
  G.setFeeds = function (s, hopId, packId) { const h = G.byId(s, hopId); if (h) h.feeds = packId; };
  G.setCrew = function (s, id, n) { const m = G.byId(s, id), d = PT.EQUIP[m.type]; m.crew = clamp(n, 0, d.crewMax || d.crew); };
  G.setTransport = (s, n) => { s.transport = clamp(n, 0, 8); };
  // IBC 컨테이너 사고팔기
  G.setIbc = function (s, n) {
    n = clamp(n, 0, 20);
    const d = n - (s.ibcCount || 0);
    if (!d) return true;
    if (d > 0) {
      const cost = d * PT.IBC.cost;
      if (s.cash < cost) return false;
      s.cash -= cost; s.invested += cost; s.ibcPaid += cost;
    } else {
      const book = Math.min(s.ibcPaid, -d * PT.IBC.cost), refund = book * G.refundRate(s);
      s.cash += refund; s.invested -= refund; s.ibcPaid -= book;
    }
    s.ibcCount = n;
    return true;
  };
  G.hasIbc = s => s.machines.some(m => PT.EQUIP[m.type].ibc || ['dock', 'wash'].includes(PT.EQUIP[m.type].stage));

  // 시나리오 6: 1층 순차 라인이 이미 돌고 있다. 설비는 투자액에 잡히지만 예산(현금)은 고스란히 증설에 쓴다
  G.prebuild = function (s) {
    // 건물 기본 공사도 이미 끝난 상태라 자본 전부가 증설 예산이다
    const cash = s.capital, n = s.log.length;
    s.cash = 1e12;
    G.quickStart(s, 'flat');
    G.place(s, 'rawRack', 1, 1, 6, false);   // 원료 6종을 넘으니 랙도 두 개
    s.machines.forEach(m => (m.legacy = true));
    Object.values(s.links).forEach(l => (l.legacy = true));
    s.cash = cash;
    s.log.splice(0, s.log.length - n);
    log(s, `1층에 기존 순차 라인(장부가 ${won(G.equipValue(s))})이 돌고 있습니다. 증설 예산 ${won(cash)}을 어디에 쓸지 정하세요.`, 'good');
  };
  G.undoAddOn = function (s) {
    s.machines.filter(m => !m.legacy).forEach(m => G.sell(s, m.id));
    G.setIbc(s, 0);
    s.transport = 1;
  };
  // 시나리오 6 증설안: 기존 1층 라인 위(2층)에 얹는다
  G.addOn = function (s, kind) {
    const packs = s.machines.filter(m => m.floor === 1 && PT.EQUIP[m.type].stage === 'pack');
    if (!packs.length || s.machines.some(m => m.floor === 2)) return false;
    const t = (type, f, x, y) => G.place(s, type, f, x, y, false);
    const lift = s.machines.find(m => m.type === 'rawLift') || t('rawLift', 1, 1, 1);
    const raw = t('rawRack', 2, 1, 3);
    if (!lift || !raw) return false;
    if (kind === 'line2') {
      // 같은 순차 라인 하나 더: 2층 계량 → 2층 믹서(포장기 바로 위) → 슈트·공압으로 1층 포장기
      const w = t('weighManual', 2, 4, 4), main = packs[0];
      const mx = w && t('mixR1000', 2, main.x, main.y);
      if (!mx) return false;
      G.setCrew(s, w.id, 2);
      G.setLink(s, w.id, mx.id, 'conveyor');
      packs.forEach(p => G.setLink(s, mx.id, p.id, p === main ? 'chute' : 'pneumatic'));
      log(s, '증설안 A: 2층에 순차 라인(계량대·믹서)을 하나 더 놓고 1층 포장기로 내려보냅니다.', 'good');
      return true;
    }
    // IBC 병렬 라인: 2층 충전 → 블렌더 → 포장기 바로 위 배출 스테이션, 세척기, 컨테이너 8개, 지게차 기사 2명
    const f = t('ibcFill', 2, 4, 4), b = f && t('ibcBlender', 2, 7, 4), wsh = b && t('ibcWasher', 2, 13, 4);
    if (!wsh) return false;
    if (packs.some(p => !t('ibcDock', 2, p.x, p.y))) return false;
    G.setCrew(s, f.id, 2);
    G.setIbc(s, 8);
    s.transport = Math.max(s.transport, 2);
    log(s, '증설안 B: 2층에 IBC 병렬 라인(충전·블렌더·세척기·배출 스테이션, 컨테이너 8개)을 놓았습니다. 컨테이너는 지게차가 옮깁니다.', 'good');
    return true;
  };

  // 처음 하는 사람을 위한 추천 배치: 1층 한 줄 + 컨베이어
  // kind 'tower': 4층 계량 → 3층 믹서 → 2층 호퍼 → 1층 포장기를 낙하 슈트로 잇는다.
  // 빠르지만 원료 리프트와 층 관리비가 든다. 주문이 능력을 넘칠 때 유리하다.
  G.quickStart = function (s, kind) {
    if (s.machines.length) return false;
    const fmts = new Set(s.enabled.map(id => PT.SKU[id].fmt));
    if (kind === 'tower') {
      const t = (type, f, x, y) => G.place(s, type, f, x, y, false);
      const raw = t('rawRack', 4, 4, 3), w = t('weighManual', 4, 7, 4), lift = t('rawLift', 1, 1, 1);
      const mx = t('mixR1000', 3, 7, 4), h = t('hopper', 2, 7, 4), fg = t('fgRack', 1, 13, 3);
      const main = t(fmts.has('bulk') ? 'bagger' : 'pouch', 1, 7, 4);
      const side = fmts.has('bulk') && fmts.has('retail') ? t('pouch', 1, 10, 6) : null;
      if (![raw, w, lift, mx, h, fg, main].every(Boolean) || (fmts.has('bulk') && fmts.has('retail') && !side)) return false;
      G.setCrew(s, w.id, 2);
      h.feeds = main.id;
      G.setLink(s, w.id, mx.id, 'chute');
      G.setLink(s, mx.id, h.id, 'chute');
      G.setLink(s, main.id, fg.id, 'conveyor');
      if (side) { G.setLink(s, mx.id, side.id, 'pneumatic'); G.setLink(s, side.id, fg.id, 'conveyor'); }
      s.transport = 0;
      log(s, '4층 타워로 깔았습니다: 4층 계량 → 3층 믹서 → 2층 호퍼 → 1층 포장기, 낙하 슈트로 연결. 원료는 리프트가 올립니다.', 'good');
      return true;
    }
    const m = (t, x, y) => G.place(s, t, 1, x, y, false);
    const raw = m('rawRack', 1, 3), w = m('weighManual', 4, 4), mx = m('mixR1000', 7, 4), fg = m('fgRack', 15, 3);
    const packs = [];
    if (fmts.has('bulk')) packs.push(m('bagger', 11, fmts.has('retail') ? 2 : 4));
    if (fmts.has('retail')) packs.push(m('pouch', 11, fmts.has('bulk') ? 6 : 4));
    if (![raw, w, mx, fg].every(Boolean) || packs.some(p => !p)) return false;
    G.setCrew(s, w.id, 2);
    G.setLink(s, w.id, mx.id, 'conveyor');
    packs.forEach(p => { G.setLink(s, mx.id, p.id, 'conveyor'); G.setLink(s, p.id, fg.id, 'conveyor'); });
    log(s, '추천 배치로 1층에 라인 하나를 깔았습니다. 여기서부터 바꿔보세요.', 'good');
    return true;
  };

  // ── 영업 품목 ───────────────────────────────────
  G.toggleSku = function (s, id) {
    const i = s.enabled.indexOf(id);
    if (i >= 0) s.enabled.splice(i, 1); else s.enabled.push(id);
  };

  // ── 관리직 ──────────────────────────────────────
  G.refreshCandidates = function (s, free) {
    if (!free) {
      if (s.cash < 3000000) return false;
      s.cash -= 3000000; s.dayExtra += 3000000;
    }
    const rng = PT.rng(s.seed, 'cand', s.candSeq++);
    const roles = Object.keys(PT.ROLES), traits = Object.keys(PT.TRAITS);
    s.candidates = [0, 1, 2].map(i => {
      const role = i === 0 && s.candSeq === 1 ? 'leader' : pick(rng, roles);
      const u = rng(), level = u < 0.45 ? 1 : u < 0.85 ? 2 : 3;
      const trait = rng() < 0.35 ? 'none' : pick(rng, traits);
      const salary = Math.round(PT.ROLES[role].pay * (0.75 + 0.25 * level) * PT.TRAITS[trait].pay / 10000) * 10000;
      return { id: 'c' + s.candSeq + i, name: pick(rng, PT.SURNAMES) + pick(rng, PT.GIVEN), role, level, trait, salary };
    });
    return true;
  };
  G.hire = function (s, cid) {
    const c = s.candidates.find(x => x.id === cid);
    if (!c || s.managers.length >= G.seats(s)) return false;
    const fee = c.salary * 5;
    if (s.cash < fee) return false;
    s.cash -= fee; s.dayExtra += fee;
    s.managers.push(Object.assign({}, c, { id: 'h' + s.nextId++, hired: s.day, sat: clamp(68 + PT.TRAITS[c.trait].sat * 6, 30, 90) }));
    s.candidates = s.candidates.filter(x => x !== c);
    log(s, `${PT.ROLES[c.role].name} ${c.name}님이 입사했습니다 (채용비 ${won(fee)}).`, 'good');
    return true;
  };
  G.fire = function (s, id) {
    const m = s.managers.find(x => x.id === id);
    if (!m) return;
    const pay = m.salary * 10;
    s.cash -= pay; s.dayExtra += pay;
    s.managers = s.managers.filter(x => x !== m);
    s.managers.forEach(o => (o.sat = clamp(o.sat - 6, 0, 100)));
    log(s, `${m.name}님을 내보냈습니다 (위로금 ${won(pay)}). 남은 관리직들이 술렁입니다.`, 'warn');
  };
  G.raise = function (s, id) {
    const m = s.managers.find(x => x.id === id);
    if (!m) return;
    m.salary = Math.round(m.salary * 1.2 / 10000) * 10000;
    m.sat = clamp(m.sat + 22, 0, 100);
  };
  function quit(s, m, why) {
    s.managers = s.managers.filter(x => x !== m);
    s.totals.quits++;
    log(s, `${PT.ROLES[m.role].name} ${m.name}님이 ${why} 회사를 떠났습니다. 그동안의 효과도 함께 사라집니다.`, 'bad');
  }

  // ── 주문 ────────────────────────────────────────
  function genOrders(s) {
    const sc = G.scen(s), mods = PT.mods(s);
    const grow = 1 + sc.growth * (s.day - 1);
    const boost = G.effect(s, 'boost');
    // 품목을 늘려도 시장 전체 수요는 조금만 늘고, 주문이 더 작고 드물게 쪼개진다
    const split = s.enabled.length <= 2 ? 1 : Math.sqrt(2 / s.enabled.length);
    s.enabled.forEach(id => {
      const k = PT.SKU[id], pk = PT.PACKS[k.pack];
      const rng = PT.rng(s.seed, s.day, 'o:' + id);
      let chance = pk.chance * sc.demand * grow * Math.sqrt(split) * (boost && boost.recipe === k.recipe ? 2 : 1) * (k.custom ? 0.7 : 1);
      let n = Math.floor(chance) + (rng() < chance % 1 ? 1 : 0);
      for (let i = 0; i < n; i++) {
        const step = k.fmt === 'bulk' ? 500 : 250;
        const kg = Math.max(step * 2, Math.round((pk.lot[0] + rng() * (pk.lot[1] - pk.lot[0])) * sc.lot * Math.sqrt(split) / step) * step);
        const due = s.day + sc.due[0] + Math.floor(rng() * (sc.due[1] - sc.due[0] + 1));
        const price = Math.round(k.price * (0.96 + rng() * 0.08) * mods.price * (sc.price || 1) / 10) * 10;
        s.orders.push({ id: `O${s.day}-${id}-${i}`, cust: pick(rng, PT.CUSTOMERS), sku: id, kg, due, price, value: price * kg, status: 'open', day: s.day });
      }
    });
    const c = s.contract;
    if (c && c.active && s.day >= c.start && s.day <= c.end) {
      const k = PT.SKU[c.sku];
      s.orders.push({ id: `C${s.day}`, cust: c.cust, sku: c.sku, kg: c.kg, due: s.day + 1, price: k.price, value: k.price * c.kg, status: 'open', day: s.day, contract: true });
    }
  }
  G.shortfalls = function (s) {
    const fg = Object.assign({}, s.fg);
    return s.orders.filter(o => o.status === 'open').sort((a, b) => a.due - b.due || a.id.localeCompare(b.id)).map(o => {
      const have = fg[o.sku] || 0, short = Math.max(0, o.kg - have);
      fg[o.sku] = Math.max(0, have - o.kg);
      return { order: o, short };
    });
  };

  // ── 생산 순서 ───────────────────────────────────
  const cleanKey = id => { const k = PT.SKU[id]; return k.allergens.length * 10 + (k.strong ? 5 : 0) + (k.fmt === 'retail' ? k.packKg : 0); };
  G.makePlan = function (s) {
    const sf = G.shortfalls(s).filter(x => x.short > 0);
    const plan = [];
    const push = (sku, kg) => { const last = plan[plan.length - 1]; if (last && last.sku === sku) last.kg += kg; else plan.push({ sku, kg }); };
    if (s.planRule === 'due') { sf.forEach(({ order, short }) => push(order.sku, short)); return plan; }
    const group = list => {
      const by = {};
      list.forEach(({ order, short }) => { (by[order.sku] = by[order.sku] || { sku: order.sku, kg: 0, due: order.due }).kg += short; });
      return Object.values(by);
    };
    const urgent = group(sf.filter(x => x.order.due <= s.day + 1)), later = group(sf.filter(x => x.order.due > s.day + 1));
    if (s.planRule === 'smart' && PT.mods(s).analyst >= 0.5) {
      // 데이터 분석가: 지금 믹서에 남은 제품에서 출발해 전환이 가장 짧은 다음 품목을 고른다
      const mixer = s.machines.find(m => PT.EQUIP[m.type].stage === 'mix' && !PT.EQUIP[m.type].ibc);
      let cur = mixer && s.lastSku[mixer.id] ? PT.SKU[s.lastSku[mixer.id]] : null;
      const def = mixer ? PT.EQUIP[mixer.type] : PT.EQUIP.mixR1000;
      const chain = list => {
        const left = list.slice();
        while (left.length) {
          let bi = 0, bc = Infinity;
          left.forEach((r, i) => {
            const k = PT.SKU[r.sku], ch = PT.mixChange(cur, k, def);
            const c = (ch ? ch.min : 0) + (cur && cur.pack !== k.pack ? 20 : 0) + r.due * 0.01;
            if (c < bc) { bc = c; bi = i; }
          });
          const r = left.splice(bi, 1)[0];
          push(r.sku, r.kg); cur = PT.SKU[r.sku];
        }
      };
      chain(urgent); chain(later);
      return plan;
    }
    urgent.sort((a, b) => cleanKey(a.sku) - cleanKey(b.sku) || a.due - b.due).forEach(r => push(r.sku, r.kg));
    later.sort((a, b) => cleanKey(a.sku) - cleanKey(b.sku) || a.due - b.due).forEach(r => push(r.sku, r.kg));
    return plan;
  };

  // ── 아침 소식 ───────────────────────────────────
  function newsCard(s, id, rng) {
    const sc = G.scen(s), mods = PT.mods(s);
    switch (id) {
      case 'wheat': return { kind: 'wheat', title: '국제 밀 가격 급등', text: '앞으로 5일간 밀가루 값이 25% 오릅니다. 미리 사두면 지금 값에 확보할 수 있습니다.',
        choices: [['미리 사두기 · 3,000만원', 'buy'], ['그냥 버틴다', 'skip']] };
      case 'tv': {
        const rc = pick(rng, ['WF', 'HC', 'BR', 'DB']);
        const r = PT.RECIPES.find(x => x.id === rc);
        const on = s.enabled.some(e => PT.SKU[e].recipe === rc);
        return { kind: 'tv', recipe: rc, title: `TV 예능에 ${r.name}가 나왔다`, text: `3일간 ${r.name} 주문이 두 배로 들어옵니다.${on ? '' : ' 지금은 영업하지 않는 배합입니다.'}`,
          choices: on ? [['좋다!', 'ok']] : [[`${r.name} 1kg 영업 시작`, 'enable'], ['우리 품목이 아니다', 'skip']] };
      }
      case 'pb': {
        const sku = pick(rng, ['HC-p1', 'BU-p1', 'TW-p1', 'WF-p1']);
        const kg = 6000 + Math.floor(rng() * 5) * 1000;
        return { kind: 'pb', sku, kg, title: '대형마트 PB 입찰', text: `${PT.SKU[sku].name} ${kg / 1000}톤을 5일 안에 납품. 단가는 평소의 85%. 물량은 크지만 이익이 얇습니다.`,
          choices: [['입찰 참여 (수주)', 'take'], ['사양한다', 'skip']] };
      }
      case 'inspect': return { kind: 'inspect', title: '식약처 불시 점검 통보', text: `오늘 오전 1시간 점검 대응으로 라인이 멈춥니다. 통과 확률 ${Math.round(mods.audit * 100)}% (식품 전문가가 있으면 오릅니다). 떨어지면 벌금 1,000만원과 추가 2시간 정지.`, choices: [['알겠다', 'ok']] };
      case 'heat': return { kind: 'heat', title: '폭염 주의보', text: '3일간 작업 속도가 7% 떨어집니다. 이동식 에어컨을 들이면 막을 수 있습니다.',
        choices: [['에어컨 설치 · 1,500만원', 'buy'], ['버틴다', 'skip']] };
      case 'blackout': return { kind: 'blackout', title: '정전 예정 안내', text: '오늘 오후 1시부터 1시간 동안 전기가 끊깁니다.', choices: [['알겠다', 'ok']] };
      case 'custom': {
        const left = PT.RECIPES.filter(r => r.custom && !s.registered.some(id => PT.SKU[id].recipe === r.id));
        if (!left.length) return null;
        const r = pick(rng, left), pk = rng() < 0.5 ? 'p1' : 'b20';
        const sku = PT.SKU[r.id + '-' + pk];
        const fee = Math.round(PT.REG_FEE * mods.regFee / 10000) * 10000;
        const tags = [sku.allergens.length ? `알러겐 ${sku.allergens.join('·')}` : '알러겐 없음', sku.strong ? '진한 색·향' : '밝은 색'].join(' · ');
        return { kind: 'custom', sku: sku.id, fee, title: `영업팀: "${pick(rng, PT.CUSTOMERS)} 전용 신제품 받아도 될까요?"`,
          text: `${sku.name} — ${tags}. 단가 ${sku.price.toLocaleString()}원/kg로 기존보다 kg당 이익이 큽니다. 등록비 ${won(fee)}. 등록하면 영업 품목에 추가되고 주문이 들어옵니다.`,
          choices: [['등록하고 영업 시작', 'take'], ['거절한다', 'skip']] };
      }
      case 'contract': {
        if (s.contract && s.contract.active) return null;
        const bulk = s.enabled.filter(id => PT.SKU[id].fmt === 'bulk');
        const sku = bulk.length ? pick(rng, bulk) : (s.enabled[0] || 'BU-b20');
        const kg = (PT.SKU[sku].fmt === 'bulk' ? 2000 + Math.floor(rng() * 3) * 1000 : 1000 + Math.floor(rng() * 2) * 500) * sc.lot;
        const cust = pick(rng, PT.CUSTOMERS);
        return { kind: 'contract', sku, kg, cust, title: `${cust}: 장기 납품 계약 제안`,
          text: `내일부터 7일간 매일 ${PT.SKU[sku].name} ${(kg / 1000).toFixed(1)}톤을 다음 날까지 납품. 모두 지키면 보너스 2,500만원, 못 지킨 날마다 위약금 300만원.`,
          choices: [['계약한다', 'take'], ['사양한다', 'skip']] };
      }
    }
    return null;
  }

  G.startDay = function (s) {
    s.morning = []; s.strikeToday = false; s.todayDown = []; s.dayExtra = 0;
    const sc = G.scen(s);
    const rng = PT.rng(s.seed, s.day, 'morning');
    const uNews = rng(), uCustom = rng(), newsPick = rng();
    if (s.day >= 2 && uNews < sc.newsRate) {
      const pool = PT.NEWS.filter(n => n !== 'custom' && n !== 'contract');
      const c = newsCard(s, pool[Math.floor(newsPick * pool.length)], PT.rng(s.seed, s.day, 'news'));
      if (c) s.morning.push(c);
    }
    if (s.day >= 2 && uCustom < sc.customRate) { const c = newsCard(s, 'custom', PT.rng(s.seed, s.day, 'custom')); if (c) s.morning.push(c); }
    if (sc.contractDay === s.day || (s.day === 8 && !s.contract)) { const c = newsCard(s, 'contract', PT.rng(s.seed, s.day, 'contract')); if (c) s.morning.push(c); }
    // 잔업이 이어지면 작업자 불만
    const otDays = s.history.slice(-4).filter(h => h.ot > 0).length;
    if (otDays >= 3 && G.power(s, 'leader') < 1) {
      s.morning.push({ kind: 'strike', title: '작업자들이 잔업에 지쳤습니다', text: `최근 4일 중 ${otDays}일 잔업. 반장이 "오늘은 좀 쉬어야겠다"는 분위기라고 전합니다. 생산 리더가 있으면 이런 일이 줄어듭니다.`,
        choices: [[`회식과 격려금 · ${won(3000000 + G.headcount(s) * 100000)}`, 'pay'], ['못 들은 척한다 (반나절 멈출 수 있음)', 'risk']] });
    }
    // 관리직: 퇴사 통보·스카우트
    s.managers.forEach(m => {
      const r = PT.rng(s.seed, s.day, 'm:' + m.id)();
      if (m.sat < 30) s.morning.push({ kind: 'resign', mid: m.id, title: `${m.name}님의 사직서`, text: `${PT.ROLES[m.role].name} ${m.name}님이 만족도 ${Math.round(m.sat)}로 사직서를 냈습니다. 붙잡으려면 연봉을 올려야 합니다.`,
        choices: [[`연봉 25% 인상하고 붙잡기 (일 ${won(Math.round(m.salary * 1.25 / 10000) * 10000)})`, 'keep'], ['보내준다', 'let']] });
      else if (r < 0.035 + (m.trait === 'leaving' ? 0.05 : 0)) s.morning.push({ kind: 'poach', mid: m.id, title: `경쟁사가 ${m.name}님을 노립니다`, text: `${PT.ROLES[m.role].name} ${m.name}님에게 스카우트 제의가 들어왔습니다.`,
        choices: [[`연봉 20% 올려 맞불 (일 ${won(Math.round(m.salary * 1.2 / 10000) * 10000)})`, 'keep'], ['잡지 않는다', 'let']] });
    });
    if (s.day > 1 && s.day % 5 === 1) G.refreshCandidates(s, true);
    genOrders(s);
    s.plan = G.makePlan(s);
  };

  G.resolve = function (s, idx, choice) {
    const c = s.morning[idx];
    if (!c || c.done) return;
    c.done = choice;
    const spend = (amt, label) => { s.cash -= amt; s.dayExtra += amt; c.result = `${label} (${won(amt)})`; };
    switch (c.kind) {
      case 'wheat': if (choice === 'buy') spend(30000000, '밀가루를 미리 사뒀습니다'); else { s.effects.push({ kind: 'wheat', until: s.day + 4 }); c.result = '5일간 밀가루 원가가 오릅니다.'; } break;
      case 'tv':
        s.effects.push({ kind: 'boost', recipe: c.recipe, until: s.day + 2 });
        if (choice === 'enable') { const id = c.recipe + '-p1'; if (!s.enabled.includes(id)) s.enabled.push(id); c.result = `${PT.SKU[id].name}를 영업 품목에 추가했습니다.`; }
        else c.result = choice === 'ok' ? '주문이 몰려옵니다.' : '그냥 지나갑니다.';
        if (choice !== 'skip') { s.orders = s.orders.filter(o => !(o.day === s.day && o.status === 'open' && PT.SKU[o.sku].recipe === c.recipe)); genSkuOrders(s, c.recipe); s.plan = G.makePlan(s); }
        break;
      case 'pb':
        if (choice === 'take') {
          const k = PT.SKU[c.sku], price = Math.round(k.price * 0.85 / 10) * 10;
          s.orders.push({ id: `PB${s.day}`, cust: '대형마트 PB', sku: c.sku, kg: c.kg, due: s.day + 5, price, value: price * c.kg, status: 'open', day: s.day });
          s.plan = G.makePlan(s); c.result = '수주했습니다. 5일 안에 납품해야 합니다.';
        } else c.result = '사양했습니다.';
        break;
      case 'inspect': s.todayDown.push({ id: 'all', from: 0, to: 60, label: '점검 대응' }); s.inspectToday = true; c.result = '오전 1시간 점검 대응.'; break;
      case 'heat': if (choice === 'buy') spend(15000000, '에어컨을 들였습니다'); else { s.effects.push({ kind: 'heat', until: s.day + 2 }); c.result = '3일간 작업 속도가 떨어집니다.'; } break;
      case 'blackout': s.todayDown.push({ id: 'all', from: 300, to: 360, label: '정전' }); c.result = '오후 1시간 정전.'; break;
      case 'custom':
        if (choice === 'take') {
          if (s.cash < c.fee) { c.done = null; c.result = '돈이 모자랍니다.'; return; }
          spend(c.fee, `${PT.SKU[c.sku].name}를 등록했습니다`);
          s.registered.push(c.sku); s.enabled.push(c.sku);
          log(s, `신규 품목 ${PT.SKU[c.sku].name} 등록. 영업 품목이 ${s.enabled.length}개가 되었습니다.`, 'warn');
        } else c.result = '정중히 거절했습니다.';
        break;
      case 'contract':
        if (choice === 'take') { s.contract = { active: true, sku: c.sku, kg: c.kg, cust: c.cust, start: s.day + 1, end: s.day + 7, missed: 0 }; if (!s.enabled.includes(c.sku)) s.enabled.push(c.sku); c.result = '계약했습니다. 내일부터 7일간입니다.'; }
        else c.result = '사양했습니다.';
        break;
      case 'strike':
        if (choice === 'pay') { spend(3000000 + G.headcount(s) * 100000, '회식으로 분위기를 풀었습니다'); s.history.slice(-4).forEach(h => (h.ot = 0)); }
